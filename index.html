<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>門市預約與叫號｜真實資料庫版</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#172b3b;background:#f4f7f8}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
.wrap{max-width:1040px;margin:auto;padding:18px 14px 65px}.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}
h1{font-size:23px;margin:4px 0}.sub{font-size:13px;color:#64748b}.badge{border-radius:30px;background:#dcfce7;color:#166534;padding:4px 8px;font-size:11px;font-weight:800}
nav{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}nav button{background:white;border:1px solid #e2e8f0;padding:10px;border-radius:10px;font-size:13px;font-weight:700}
nav button.on{background:#dcfce7;color:#04783d;border-color:#86efac}nav button.blue.on{background:#dbeafe;color:#1d4ed8}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:19px;margin-bottom:14px}
.panel h2{margin:0 0 12px;font-size:19px}.panel p{font-size:13px;color:#64748b;line-height:1.65}.hero{background:linear-gradient(115deg,#06c755,#087d5a);color:white;padding:26px}.hero p{color:#eaffef}.hero h2{font-size:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{padding:14px;border:1px solid #e2e8f0;border-radius:12px;background:white;text-align:left}.tile strong{display:block;font-size:26px;color:#059669}
.primary{background:#06c755;border:0;color:white;font-weight:800}.secondary{background:#dbeafe;color:#1d4ed8;border:0;font-weight:700}.plain{background:#f1f5f9;color:#334155;border:0;font-weight:700}.danger{background:#fee2e2;color:#b91c1c;border:0;font-weight:700}
.btn{border-radius:10px;padding:11px 14px;min-height:44px}.btn.full{width:100%}.buttons{display:flex;gap:7px;flex-wrap:wrap}.field{width:100%;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:11px;min-width:0}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{border:1px solid #cbd5e1;background:white;border-radius:10px;padding:9px 3px;font-weight:800}.slot span{display:block;color:#64748b;font-weight:400;font-size:11px}.slot.on{background:#dcfce7;border-color:#06c755}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #e2e8f0;padding:12px 0}.row:last-child{border-bottom:0}
.small{font-size:12px;color:#64748b}.no{font-size:49px;color:#059669;font-weight:900}.status{display:inline-block;background:#eff6ff;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:700}
.notice{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:12px;border-radius:12px;margin-bottom:14px;font-size:13px}
.error{color:#991b1b;background:#fee2e2;padding:12px;border-radius:12px;margin:10px 0;font-size:13px}
.ok{color:#166534;background:#dcfce7;padding:12px;border-radius:12px;margin:10px 0;font-size:13px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f1f5f9;padding:8px;border-radius:10px}.hint{margin-top:11px;color:#64748b;font-size:12px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}.wrap{padding:13px 12px 50px}.panel{padding:15px}.head h1{font-size:20px}.no{font-size:42px}}
</style>
</head><body><div class="wrap">
<header class="head"><div><h1>📅 門市預約・取號・叫號</h1><div class="sub">GitHub Pages + 雲端 PostgreSQL 實際儲存版</div></div><div><span class="badge" id="connection">等待連線</span></div></header>
<div id="message" aria-live="polite"></div><nav id="nav"></nav>
<div class="layout"><main id="app"></main><aside id="side"></aside></div>
</div>
<script src="./db-config.js"></script>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const $=id=>document.getElementById(id);
const navItems=[["home","顧客首頁"],["reserve","預約時段"],["queue","現場取號"],["staff","店員叫號"],["checkin","預約報到"],["login","店員登入"]];
let page="home",client=null, data=null, busy=false, error="", notice="",session=null;
let currentDate=taipeiDate(),slot="",name="",party=1;
const keyStorage="store-operations-supabase-config-v1";
const initialConfig=window.STORE_DEMO_DB||{};
function taipeiDate(offset=0){const d=new Date(Date.now()+offset*86400000);const f=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d);return ["year","month","day"].map(k=>f.find(x=>x.type===k).value).join("-")}
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function config(){try{const local=JSON.parse(localStorage.getItem(keyStorage)||"{}");return {...initialConfig,...local}}catch(e){return initialConfig}}
function isConfigured(c){return /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test((c.url||"").trim())&&/^(sb_publishable_|eyJ)/.test((c.publishableKey||"").trim())}
function showErr(msg){error=msg;notice="";render()}
function showOK(msg){notice=msg;error="";render()}
function label(s){return ({WAITING:"候位中",CALLED:"已叫號",SERVING:"服務中",PASSED:"已過號",COMPLETED:"已完成",CANCELLED:"已取消",CONFIRMED:"已預約",CHECKED_IN:"已報到"})[s]||s}
function top(){const online=!!(client&&session&&data);$("connection").textContent=online?"✅ 真實資料庫已連線":"⚠ 尚未完成資料庫連線";$("nav").innerHTML=navItems.map(([p,title])=>'<button data-page="'+p+'" class="'+(p===page?'on ':'')+(['staff','checkin','login'].includes(p)?'blue':'')+'">'+title+'</button>').join("");$("message").innerHTML=(error?'<div class="error">'+safe(error)+'</div>':"")+(notice?'<div class="ok">'+safe(notice)+'</div>':"")}
function button(title,action,cls="",off=false){return '<button data-action="'+action+'" class="btn '+cls+'" '+(off?'disabled':'')+'>'+title+'</button>'}
function row(title,meta,trailing){return '<div class="row"><div><strong>'+safe(title)+'</strong><div class="small">'+safe(meta)+'</div></div><div>'+trailing+'</div></div>'}
function render(){
top();
if(!client||!session||!data){setupScreen();return}
const t=data.tickets||[],r=data.reservations||[],live=t.find(x=>x.status==="CALLED"||x.status==="SERVING"),wait=t.filter(x=>x.status==="WAITING");
$("side").innerHTML='<section class="panel"><h2>💾 真實資料庫狀態</h2><p>以下資料每 5 秒從 Supabase 重新讀取。關閉分頁、重新整理或更換裝置，資料都保留在雲端。</p><div class="grid"><div class="tile"><span class="small">等待中</span><strong>'+wait.length+'</strong></div><div class="tile"><span class="small">叫號中</span><strong>'+safe(live?live.display_number:"—")+'</strong></div></div><div class="hint">今日 '+safe(data.today)+'・目前以匿名顧客登入：'+(!data.is_staff?"是":"否")+'</div></section><section class="panel"><h2>測試提醒</h2><p>目前為測試資料庫，請只使用暱稱，不要填真實顧客姓名、電話或個人資料。</p><p>取號、預約和報到由資料庫交易處理，所有店員操作需通過伺服器端身分驗證。</p></section>';
if(page==="home"){
$("app").innerHTML='<section class="panel hero"><h2>青禾風格美髮・台北示範門市</h2><p>這次的操作會真的寫入資料庫，不再使用瀏覽器假資料。</p></section><div class="grid3 panel"><div class="tile"><div class="small">目前叫號</div><strong>'+safe(live?.display_number||"—")+'</strong></div><div class="tile"><div class="small">候位組數</div><strong>'+wait.length+'</strong></div><div class="tile"><div class="small">我的預約</div><strong>'+r.filter(x=>x.mine&&x.status!=="CANCELLED").length+'</strong></div></div><div class="panel"><h2>請選擇服務</h2><div class="grid"><button data-page="reserve" class="tile"><b>📅 線上預約</b><p>時間、人數與容量真實記錄</p></button><button data-page="queue" class="tile"><b>🎟️ 現場取號</b><p>取得獨立號碼並跨裝置查看</p></button></div></div><section class="panel"><h2>我最近的預約</h2>'+(r.filter(x=>x.mine).map(x=>row(x.name,x.day+" "+x.time+"・"+x.party+" 位",'<span class="status">'+label(x.status)+'</span>')).join("")||'<p>目前沒有預約。</p>')+'</section>';
}else if(page==="reserve"){
const slots=(data.slots||[]).map(x=>'<button class="slot '+(slot===x.time?"on":"")+'" data-slot="'+safe(x.time)+'" '+(x.available<1?"disabled":"")+'>'+safe(x.time)+'<span>'+x.available+' 位可預約</span></button>').join("");
$("app").innerHTML='<section class="panel"><h2>📅 選擇預約時段</h2><p>單一時段最多 3 位。多人同時預約由資料庫防止超賣。</p><label for="book-date">日期（30 日內）</label><input class="field" id="book-date" type="date" min="'+taipeiDate()+'" max="'+taipeiDate(30)+'" value="'+safe(currentDate)+'"><label>時段</label><div class="slots">'+slots+'</div><div class="grid"><div><label for="book-name">暱稱</label><input class="field" id="book-name" maxlength="32" placeholder="測試小明" value="'+safe(name)+'"></div><div><label for="book-party">人數</label><select class="field" id="book-party"><option value="1">1 位</option><option value="2">2 位</option><option value="3">3 位</option></select></div></div><div style="margin-top:16px">'+button("確認送出預約","book","primary full",busy)+'</div></section><section class="panel"><h2>我的預約</h2>'+(r.filter(x=>x.mine).map(x=>row(x.name,x.day+" "+x.time+"・"+x.party+" 位",'<div class="buttons"><span class="status">'+label(x.status)+'</span>'+(x.status==="CONFIRMED"?'<button class="btn danger" data-cancel-book="'+safe(x.id)+'">取消</button>':"")+'</div>')).join("")||'<p>沒有預約紀錄。</p>')+'</section>';
$("book-party").value=String(party);
}else if(page==="queue"){
const mine=t.find(x=>x.mine&&["WAITING","CALLED","SERVING"].includes(x.status));
$("app").innerHTML='<section class="panel"><h2>🎟️ 現場取號</h2><p>資料存於資料庫，同一位使用者同一天不可同時擁有兩張有效票。</p>'+(mine?'<div class="tile" style="text-align:center"><div class="small">我的號碼</div><div class="no">'+safe(mine.display_number)+'</div><span class="status">'+label(mine.status)+'</span><p>前面等候 '+Math.max(0,wait.findIndex(x=>x.ticket_no===mine.ticket_no))+' 組</p></div><div style="margin-top:12px">'+(mine.status==="WAITING"?button("取消取號","cancel-ticket","danger",busy):"")+'</div>':'<label for="take-name">取號暱稱</label><input id="take-name" maxlength="32" class="field" placeholder="測試小明"><div style="margin-top:12px">'+button("立即取號","take-ticket","primary full",busy)+'</div>')+'</section><section class="panel"><h2>現在叫號 '+safe(live?.display_number||"—")+'</h2>'+ (wait.map((x,i)=>row(x.display_number,"第 "+(i+1)+" 位等待",'<span class="status">'+label(x.status)+'</span>')).join("")||'<p>尚無候位號碼。</p>')+'</section>';
}else if(page==="login"){
$("app").innerHTML='<section class="panel"><h2>🔐 店員登入</h2><p>需要先在 Supabase Authentication 建立店員帳號，再將該使用者 ID 加到 so_demo_staff 表。這個頁面不會在瀏覽器暴露管理員密鑰。</p><label for="staff-email">電子郵件</label><input id="staff-email" type="email" class="field" autocomplete="username"><label for="staff-password">密碼</label><input id="staff-password" type="password" class="field" autocomplete="current-password"><div class="buttons" style="margin-top:13px">'+button("登入店員帳號","staff-login","primary",busy)+button("登出並切回匿名顧客","logout","plain",busy)+'</div></section>';
}else if(page==="staff"||page==="checkin"){
if(!data.is_staff){$("app").innerHTML='<section class="panel"><h2>🔒 需要店員權限</h2><p>店員叫號、過號回歸和預約報到不能由一般顧客執行。</p>'+button("前往店員登入","go-login","primary")+'</section>';return}
if(page==="staff"){
const missed=t.filter(x=>x.status==="PASSED");
$("app").innerHTML='<section class="panel"><h2>📣 店員叫號控制台</h2><div class="grid3"><div class="tile"><span class="small">現在叫號</span><strong>'+safe(live?.display_number||"—")+'</strong></div><div class="tile"><span class="small">等候中</span><strong>'+wait.length+'</strong></div><div class="tile"><span class="small">過號</span><strong>'+missed.length+'</strong></div></div><div class="buttons" style="margin-top:17px">'+button("叫下一位","call","primary",busy||!!live||!wait.length)+button("再叫一次","recall","plain",busy||!live||live.status!=="CALLED")+button("開始服務","start","secondary",busy||!live||live.status!=="CALLED")+button("完成服務","complete","secondary",busy||!live)+button("標記過號","pass","danger",busy||!live)+'</div></section><section class="panel"><h2>候位順序</h2>'+(wait.map((x,i)=>row(x.display_number,x.name+"・"+(x.source==="WALKIN"?"現場取號":"預約報到"),'<span class="small">第 '+(i+1)+' 位</span>')).join("")||'<p>沒有等待中的顧客</p>')+'</section><section class="panel"><h2>過號名單</h2>'+(missed.map(x=>row(x.display_number,x.name,'<button class="btn plain" data-return="'+x.ticket_no+'">安排下一位</button>')).join("")||'<p>目前無過號</p>')+'</section>';
}else{
$("app").innerHTML='<section class="panel"><h2>✅ 預約到店報到</h2><p>只有今日的有效預約可報到。報到後將新增一張真實號碼牌。</p>'+(r.filter(x=>x.day===data.today).map(x=>row(x.name,x.time+"・"+x.party+" 位・"+label(x.status),(x.status==="CONFIRMED"?'<button class="btn secondary" data-checkin="'+safe(x.id)+'">報到取號</button>':x.ticket_no?'<span class="status">A'+String(x.ticket_no).padStart(3,"0")+'</span>':""))).join("")||'<p>今日沒有預約紀錄</p>')+'</section>';
}
}
}
function setupScreen(){
$("side").innerHTML='<section class="panel"><h2>部署狀態</h2><p>GitHub Pages 已部署；尚未有可連線的 Supabase 專案。資料庫建立之前，不會假裝預約成功。</p><p>資料庫 SQL：<a href="https://github.com/hub-google/LINE/blob/main/store-operations/supabase/schema.sql">schema.sql</a></p></section>';
$("app").innerHTML='<section class="panel"><h2>💾 連接雲端 PostgreSQL</h2><p>本版所有操作都會寫入 Supabase，需先建立免費專案、在 SQL Editor 執行 schema.sql，並在 Authentication 啟用匿名登入。</p><p><b>請只輸入 Supabase Project URL 和 publishable key。</b>不要輸入 secret / service_role 密鑰。</p><label for="db-url">Supabase Project URL</label><input class="field" id="db-url" placeholder="https://xxxxxxxx.supabase.co" value="'+safe(config().url||"")+'"><label for="db-key">Publishable key（公開金鑰）</label><input class="field" id="db-key" placeholder="sb_publishable_..." value="'+safe(config().publishableKey||"")+'"><div style="margin-top:13px">'+button("連接真實資料庫","connect","primary full")+'</div><div class="hint">輸入設定僅保存在你目前瀏覽器；完成驗收後，可把公開設定寫入 GitHub Pages，讓任何裝置直接使用同一套後端。</div></section>';
}
async function refresh(){if(!client||!session)return;const r=await client.rpc("so_demo_state",{p_date:currentDate});if(r.error)throw r.error;data=r.data;render()}
async function start(){
const c=config();
if(!isConfigured(c)){error="尚未配置 Supabase 資料庫，請先連接。";render();return}
try{
client=createClient(c.url.trim(),c.publishableKey.trim(),{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const r=await client.auth.getSession();if(r.error)throw r.error;session=r.data.session;
if(!session){const anon=await client.auth.signInAnonymously();if(anon.error)throw anon.error;session=anon.data.session}
await refresh();error="";
}catch(e){data=null;error="雲端連線失敗："+(e.message||e)+"。請確認 Supabase Anonymous Sign-Ins 已開啟、SQL 已套用。";render()}
}
async function run(fn){
if(busy)return;
busy=true;error="";notice="";render();
try{await fn();await refresh()}catch(e){error=e.message||String(e);render()}
finally{busy=false;render()}
}
function rpc(name,params){return client.rpc(name,params).then(r=>{if(r.error)throw r.error;return r.data})}
document.addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;
if(b.dataset.page){name=$("book-name")?.value||name;party=Number($("book-party")?.value||party);page=b.dataset.page;render();return}
if(b.dataset.slot){name=$("book-name")?.value||name;party=Number($("book-party")?.value||party);slot=b.dataset.slot;render();return}
if(b.dataset.action==="connect"){
const url=$("db-url").value.trim(),publishableKey=$("db-key").value.trim();
if(!isConfigured({url,publishableKey})){showErr("請輸入正確的 Supabase URL 和 publishable key");return}
localStorage.setItem(keyStorage,JSON.stringify({url,publishableKey}));client=null;session=null;data=null;start();return;
}
if(!client||!session||!data)return;
if(b.dataset.action==="go-login"){page="login";render();return}
if(b.dataset.action==="book"){const bookingName=($("book-name")?.value||"").trim();const bookingParty=Number($("book-party")?.value||1);name=bookingName;party=bookingParty;
run(async()=>{if(!slot||!bookingName)throw Error("請填暱稱並選擇時段");await rpc("so_demo_book",{p_name:bookingName,p_date:currentDate,p_slot:slot,p_party:bookingParty});notice="預約已寫入資料庫";slot=""});return}
if(b.dataset.action==="take-ticket"){const nm=($("take-name")?.value||"").trim()||"現場顧客";run(async()=>{const x=await rpc("so_demo_take_ticket",{p_name:nm});notice="取號成功："+x.display_number});return}
if(b.dataset.action==="cancel-ticket"){const t=data.tickets.find(x=>x.mine&&x.status==="WAITING");if(t&&confirm("確定取消 "+t.display_number+"？"))run(async()=>{await rpc("so_demo_cancel_ticket",{p_ticket_no:t.ticket_no});notice="已取消取號"});return}
if(b.dataset.cancelBook){if(confirm("確定取消這筆預約？"))run(async()=>{await rpc("so_demo_cancel_reservation",{p_id:b.dataset.cancelBook});notice="已取消預約"});return}
if(b.dataset.action==="staff-login"){const email=$("staff-email")?.value,password=$("staff-password")?.value;
run(async()=>{const r=await client.auth.signInWithPassword({email,password});if(r.error)throw r.error;session=r.data.session;page="staff";notice="登入完成，正在檢查店員權限"});return}
if(b.dataset.action==="logout"){run(async()=>{const q=await client.auth.signOut();if(q.error)throw q.error;const a=await client.auth.signInAnonymously();if(a.error)throw a.error;session=a.data.session;page="home";notice="已切回匿名顧客"});return}
if(b.dataset.action&&["call","recall","start","complete","pass"].includes(b.dataset.action)){
const action=b.dataset.action;run(async()=>{const result=await rpc("so_demo_staff_action",{p_action:action});notice="店員操作完成："+(result.display_number||action)});return}
if(b.dataset.return){run(async()=>{await rpc("so_demo_staff_action",{p_action:"return",p_ticket_no:Number(b.dataset.return)});notice="已安排到下一位"});return}
if(b.dataset.checkin){run(async()=>{const r=await rpc("so_demo_staff_action",{p_action:"checkin",p_reservation_id:b.dataset.checkin});notice="報到成功，號碼 "+r.display_number});return}
});
document.addEventListener("change",e=>{if(e.target.id==="book-date"){currentDate=e.target.value;slot="";run(async()=>{await refresh()})}});
window.addEventListener("focus",()=>{if(client&&session)refresh().catch(e=>showErr(e.message||String(e)))});
setInterval(()=>{if(!document.hidden&&client&&session&&!busy)refresh().catch(e=>{error=e.message||String(e);render()})},5000);
start();
</script></body></html>
