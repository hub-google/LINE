<!doctype html>
<html lang="zh-Hant" class="board-fit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="line-saas-build" content="f9d4c7fb6b36401671f570057fb4049952ca5b70">
  <script defer src="./version-watch.js?build=f9d4c7fb6b36401671f570057fb4049952ca5b70"></script>
  <meta name="theme-color" content="#113d38">
  <title>排隊怪獸｜即時叫號看板</title>
  <meta name="description" content="店內電視專用即時叫號看板，顯示目前號碼與下一批候位排序。">
  <link rel="stylesheet" href="./assets/board/page-SQNSCKMO.css?build=f9d4c7fb6b36401671f570057fb4049952ca5b70">
<link rel="stylesheet" href="./site-auth.css?build=f9d4c7fb6b36401671f570057fb4049952ca5b70"><script defer src="./site-auth.js?build=f9d4c7fb6b36401671f570057fb4049952ca5b70"></script><link rel="stylesheet" href="./monster-world.css?build=f9d4c7fb6b36401671f570057fb4049952ca5b70"><link rel="icon" type="image/svg+xml" href="./monster-mascot.svg"></head>
<body data-monster-page="board">
  <header>
    <div class="shop-title"><span class="shop-icon" aria-hidden="true"><img id="shop-logo" alt="" hidden><span id="shop-icon-fallback">▤</span></span><h1 id="shop">正在讀取門市資料</h1></div>
    <div class="site-auth-slot site-auth-dark" id="site-auth-root" aria-label="使用者登入狀態"><a class="site-auth-button site-auth-login" href="./directory.html?mode=search">使用 LINE 登入</a></div><div class="board-header-status"><span id="board-update-mode" role="status" aria-live="polite">每 10 秒更新一次叫號</span><time id="clock" aria-label="目前時間">--:--</time></div>
  </header>
  <nav id="board-session-nav" hidden aria-label="目前檢視的服務場次">
    <a id="board-all-link" href="./board.html">← 返回全部場次</a>
    <span id="board-session-name" aria-live="polite"></span>
  </nav>
  <section id="unit-board" hidden aria-label="多服務單位即時叫號"></section>
  <main id="single-board" aria-label="店內即時叫號資訊">
    <section class="panel current">
      <div class="label">目前叫號</div>
      <div class="underline" aria-hidden="true"></div>
      <div id="current" class="is-empty" aria-live="polite" aria-atomic="true">資料更新中</div>
    </section>
    <section class="panel next">
      <div class="label">接下來等候排序</div>
      <div class="underline" aria-hidden="true"></div>
      <ol id="upcoming" aria-label="實際等候順序"><li class="empty">資料更新中</li></ol>
    </section>
  </main>
  <footer>
    <span id="health" data-state="loading" role="status" aria-live="polite">資料更新中</span>
    <span class="footer-note">叫號順序將依現場狀況即時更新</span>
    <span id="board-page-indicator" aria-live="off" hidden></span>
    <a class="board-platform-credit" href="./home.html">由排隊怪獸提供服務</a>
    <div class="board-controls"><button type="button" id="fullscreen">全螢幕</button></div>
    <span id="notice">目前叫號與等待順序皆由門市資料同步，不顯示顧客個資。</span>
  </footer>
  <script type="module" src="./assets/board/main-GAWMH34H.js?build=f9d4c7fb6b36401671f570057fb4049952ca5b70"></script>
</body>
</html>
