<!doctype html>
<html lang="zh-Hant" class="board-fit">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="line-saas-build" content="15d40f954ed52b7a163577524ecc0171b5eba078">
  <script defer src="./version-watch.js?build=15d40f954ed52b7a163577524ecc0171b5eba078"></script>
  <meta name="theme-color" content="#113d38">
  <title>排隊怪獸｜即時叫號看板</title>
  <meta name="description" content="店內電視專用即時叫號看板，顯示目前號碼與下一批候位排序。">
  <link rel="stylesheet" href="./assets/board/page-LHBFFRGH.css?build=15d40f954ed52b7a163577524ecc0171b5eba078">
<link rel="stylesheet" href="./site-auth.css?build=15d40f954ed52b7a163577524ecc0171b5eba078"><link rel="stylesheet" href="./assets/marketing/shared-header-ADBN6TNM.css?build=15d40f954ed52b7a163577524ecc0171b5eba078"><script defer src="./assets/marketing/shared-header-AH3NCYSO.js?build=15d40f954ed52b7a163577524ecc0171b5eba078"></script><script defer src="./site-auth.js?build=15d40f954ed52b7a163577524ecc0171b5eba078"></script><link rel="stylesheet" href="./monster-world.css?build=15d40f954ed52b7a163577524ecc0171b5eba078"><link rel="icon" type="image/svg+xml" href="./monster-mascot.svg"><link rel="stylesheet" href="./assets/marketing/dual-portals-KRERD5RM.css?build=15d40f954ed52b7a163577524ecc0171b5eba078">
</head>
<body data-monster-page="board">
  <div id="marketing-header"><div id="site-auth-root" class="site-auth-slot" role="status">正在確認登入狀態</div></div>
  <header class="board-store-header">
    <a id="shop-home-link" class="shop-title" href="./home.html" aria-label="返回此店家首頁"><span class="shop-icon" aria-hidden="true"><img id="shop-logo" alt="" hidden><span id="shop-icon-fallback">▤</span></span><h1 id="shop">正在讀取門市資料</h1></a>
    <div class="board-header-status"><span id="board-update-mode" role="status" aria-live="polite">每 10 秒更新一次叫號</span><time id="clock" aria-label="目前時間">--:--</time></div>
  </header>
  <nav id="board-session-nav" hidden aria-label="目前檢視的服務場次">
    <a id="board-all-link" href="./board.html">← 返回全部場次</a>
    <span id="board-session-name" aria-live="polite"></span>
  </nav>
  <section id="unit-board" hidden aria-label="多服務單位即時叫號"></section>
  <main id="single-board" aria-label="店內即時叫號資訊">
    <section class="panel current">
      <div class="label">目前叫號</div>
      <div class="underline" aria-hidden="true"></div>
      <div id="current" class="is-empty" aria-live="polite" aria-atomic="true">資料更新中</div>
    </section>
    <section class="panel next">
      <div class="label">接下來</div>
      <div class="underline" aria-hidden="true"></div>
      <ol id="upcoming" aria-label="實際等候順序"><li class="empty">資料更新中</li></ol>
    </section>
  </main>
  <footer>
    <span id="health" data-state="loading" role="status" aria-live="polite">資料更新中</span>
    
    <span id="board-page-indicator" aria-live="off" hidden></span>
    <a class="board-platform-credit" href="./home.html">由排隊怪獸提供服務</a>
    <div class="board-controls"><button type="button" id="fullscreen">全螢幕</button></div>
    <span id="notice">不顯示顧客個資。</span>
  </footer>
  <script type="module" src="./assets/board/main-7BP2IEBS.js?build=15d40f954ed52b7a163577524ecc0171b5eba078"></script>
</body>
</html>
