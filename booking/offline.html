<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173e34">
<title>LINE 預約｜連線暫時中斷</title>
<style>
html{font:16px/1.7 system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f8faf5;color:#173e34}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{max-width:460px;background:white;border:1px solid #dce8db;border-radius:24px;box-shadow:0 12px 40px #173e3413;padding:30px}
h1{font-size:27px;margin:0 0 14px}p{color:#547365}
button{border:0;border-radius:12px;background:#173e34;color:#fff;padding:11px 17px;cursor:pointer;font:inherit}
small{display:block;margin-top:18px;color:#768c7c}
</style></head><body><main>
<h1>目前無法連線</h1>
<p>預約、叫號與店員操作都需要連線才能確認最新狀態。請檢查網路後再重新開啟。</p>
<button type="button" onclick="location.reload()">重新連線</button>
<small>本頁不儲存顧客身分、預約明細或叫號資料。離線時不會產生新預約。</small>
</main></body></html>
