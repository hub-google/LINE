<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="cache-control" content="no-store">
  <title>排隊怪獸｜改用一般網頁</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f8fafc;color:#172033}main{width:min(440px,calc(100% - 40px));text-align:center;padding:28px 24px;border:1px solid #e2e8f0;border-radius:18px;background:white;box-sizing:border-box}h1{font-size:22px;margin:0 0 8px}p{margin:0 0 20px;color:#566273}a{display:inline-block;padding:12px 18px;border-radius:10px;background:#2563eb;color:white;text-decoration:none;font-weight:650}</style>
</head>
<body>
<main>
  <h1>排隊怪獸已改用一般網頁</h1>
  <p>LINE MINI App 已暫停使用。正在帶您前往排隊怪獸網站，原有預約、取號、訂餐功能仍可使用。</p>
  <a id="open" href="https://queue.monsterport.com/">前往排隊怪獸網站</a>
</main>
<script>
(function(){
  const origin="https://queue.monsterport.com";
  const url=new URL("/my-records.html",origin);
  const p=new URLSearchParams(location.search);
  if("my-records"==="index"){
    url.searchParams.set("view","customer");
    const merchant=p.get("merchant")||"";
    const tab=p.get("tab")||"";
    if(/^[a-z0-9][a-z0-9-]{2,39}$/.test(merchant))url.searchParams.set("merchant",merchant);
    if(["home","reserve","queue","order","progress","mine","detail"].includes(tab))url.searchParams.set("tab",tab);
  }
  const link=document.getElementById("open");
  link.href=url.href;
  window.location.replace(url.href);
})();
</script>
</body>
</html>
