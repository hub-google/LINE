<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>終止群組解散程序 - LINE群組管家</title>
    <!-- LINE LIFF SDK (選配，若在 LIFF 環境自動取得用戶暱稱) -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --bg-primary: #0F172A;
            --bg-card: #1E293B;
            --border-color: #334155;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --accent-green: #10B981;
            --accent-green-hover: #059669;
            --accent-red: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .icon-badge {
            width: 64px;
            height: 64px;
            background-color: rgba(239, 68, 68, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #F8FAFC;
        }

        p.desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .info-box {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            font-weight: 600;
            color: #E2E8F0;
            word-break: break-all;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background-color: #0F172A;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #F8FAFC;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-green);
        }

        .btn-confirm {
            width: 100%;
            background-color: var(--accent-green);
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-confirm:hover {
            background-color: var(--accent-green-hover);
        }

        .btn-confirm:active {
            transform: scale(0.99);
        }

        .security-note {
            margin-top: 20px;
            font-size: 12px;
            color: #64748B;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-badge">🛡️</div>
        <h1>保留群組確認</h1>
        <p class="desc">
            此群組目前處於解散公示期。只要您確認提出異議，<strong>解散程序將立即終止</strong>，本群組將被完整保留。
        </p>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">群組名稱</span>
                <span class="info-value">{{ group_name }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">發起解散者</span>
                <span class="info-value">{{ initiator_name }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">預計解散時間</span>
                <span class="info-value" style="color: #EF4444;">{{ dissolve_at }}</span>
            </div>
        </div>

        <!-- 兩階段確認表單（必須透過 POST 請求發送，防爬蟲 GET 預覽誤觸） -->
        <form method="POST" action="/revoke/{{ task_id }}">
            <input type="hidden" name="token" value="{{ token }}">
            
            <div class="input-group">
                <label for="member_name">您的暱稱 / 稱呼（選填）：</label>
                <input type="text" id="member_name" name="member_name" placeholder="例如：林小美" value="{{ member_name or '' }}">
            </div>

            <button type="submit" class="btn-confirm">
                ✔ 確認保留此群組 (終止解散)
            </button>
        </form>

        <p class="security-note">
            🔒 雙重防護機制：點擊確認後機器人將在群組推播終止通知並退出群組。
        </p>
    </div>

    <script>
        // 若在 LINE LIFF 環境中開啟，嘗試自動帶入使用者 LINE 暱稱
        const liffId = "{{ liff_id }}";
        if (liffId && typeof liff !== 'undefined') {
            liff.init({ liffId: liffId })
                .then(() => {
                    if (liff.isLoggedIn()) {
                        liff.getProfile().then(profile => {
                            const input = document.getElementById("member_name");
                            if (input && !input.value) {
                                input.value = profile.displayName;
                            }
                        });
                    }
                })
                .catch(err => console.log("LIFF Init error: ", err));
        }
    </script>
</body>
</html>
