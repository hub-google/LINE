<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SB_URL="https://unapiwajmgqqtdkixaab.supabase.co";
const SB_KEY="sb_publishable_L09XC4Tekm6cZaPTTczm3g_Aap-SOSy";
// Separate LINE customer and operator Supabase sessions in the same browser.
const routeBeforeAuth=new URLSearchParams(location.search);
const initialViews=routeBeforeAuth.getAll("view");
const initialView=initialViews[initialViews.length-1]||"customer";
const authOptions={persistSession:true,autoRefreshToken:true,detectSessionInUrl:false};
if(initialView==="customer")authOptions.storageKey="line-saas-customer-session-v2";
const supa=createClient(SB_URL,SB_KEY,{auth:authOptions});
const LINE_BRIDGE_URL=SB_URL+"/functions/v1/line-bridge";
let lineConfig=null,lineConfigSlug="",lineLinkStatus="not-ready",lineLinkAttempted=false,lineFriendStatus=null,lineDisplayName="",lineConnectError="";
let lineOaRecipient="UNKNOWN",lineFriendCheck="UNAVAILABLE",lineOaAddFriendUrl="",lineProviderMismatch=false;
async function bridgeConfig(){
  const merchant=isSafeMerchant(slug)?slug:"";
  if(lineConfig!==null&&lineConfigSlug===merchant)return lineConfig;
  try{
    const res=await fetch(LINE_BRIDGE_URL+"?action=config&merchant="+encodeURIComponent(merchant),{cache:"no-store"});
    if(res.ok){lineConfig=await res.json();lineConfigSlug=merchant;}
  }catch(e){console.warn("LINE 設定尚不可用");}
  return lineConfig||{};
}
function customerUrl(merchant){
 const canonical=location.origin+location.pathname+"?view=customer&merchant="+encodeURIComponent(merchant);
 // Other shops may use a different LINE provider. Never reuse this shop's LIFF ID.
 if(merchant!==slug)return canonical;
 const id=lineConfig?.liffId;
 return id?"https://liff.line.me/"+encodeURIComponent(id)+"/?view=customer&merchant="+encodeURIComponent(merchant):canonical;
}
function lineLoginUrl(){
  if(view==="staff"&&recoveryMode)
    return "https://liff.line.me/"+encodeURIComponent(lineConfig?.liffId||"")+
      "/?view=staff&merchant="+encodeURIComponent(ORIGINAL_QA_STORE)+"&recover=1";
  return "https://liff.line.me/"+encodeURIComponent(lineConfig?.liffId||"")+"/?view=customer&merchant="+encodeURIComponent(slug)+(customerTab?"&tab="+encodeURIComponent(customerTab):"")+
    (manageKind&&manageItem?"&manage="+encodeURIComponent(manageKind)+"&item="+encodeURIComponent(manageItem)+"&mode="+encodeURIComponent(manageMode):"")+
    (customerTab==="progress"&&progressTicketId?"&ticket="+encodeURIComponent(progressTicketId):"");

// Never pass LINE's one-time authorization code, PKCE state, or cache-busting
// parameters into a subsequent OAuth redirect.
function cleanLineRedirectUri(){
 const url=new URL(location.origin+location.pathname);
 url.searchParams.set("view",view);
 if(isSafeMerchant(slug))url.searchParams.set("merchant",slug);
 if(view==="staff"&&recoveryMode)url.searchParams.set("recover","1");
 if(view==="customer"){
  if(customerTab)url.searchParams.set("tab",customerTab);
  if(customerTab==="progress"&&progressTicketId)url.searchParams.set("ticket",progressTicketId);
  if(manageKind&&manageItem){
   url.searchParams.set("manage",manageKind);
   url.searchParams.set("item",manageItem);
   url.searchParams.set("mode",manageMode);
  }
 }
 return url.href;
}
function acceptVerifiedLineIdentity(result){
 if(!result?.linked||!result.displayName)throw Error("LINE 身分驗證未完成");
 lineDisplayName=result.displayName;
 lineLinkStatus="linked";
 sessionStorage.removeItem(authRecoveryKey());
 lineFriendStatus=result.isFollowing===true?true:result.isFollowing===false?false:null;
 lineOaRecipient=["REACHABLE","NOT_REACHABLE","UNKNOWN"].includes(result.recipientReachability)?result.recipientReachability:"UNKNOWN";
 lineFriendCheck=String(result.friendCheckStatus||"UNAVAILABLE");
 lineOaAddFriendUrl=typeof result.oaAddFriendUrl==="string"&&
  /^https:\/\/line\.me\/R\/ti\/p\/@[a-zA-Z0-9_.-]{2,100}$/.test(result.oaAddFriendUrl)?result.oaAddFriendUrl:"";
 lineProviderMismatch=result.providerMismatchSuspected===true;
}
async function resumeVerifiedLineSession(){
 if(view!=="customer"||!session?.access_token)return false;
 try{
  const res=await fetch(LINE_BRIDGE_URL,{
   method:"POST",
   headers:{"content-type":"application/json","authorization":"Bearer "+session.access_token},
   body:JSON.stringify({action:"resume",slug})
  });
  if(!res.ok)return false;
  const result=await res.json();
  if(!result.linked||!result.displayName)return false;
  acceptVerifiedLineIdentity(result);
  // Stale LINE OAuth callback parameters must never be replayed.
  refreshLiffRoute();
  const clean=new URL(cleanLineRedirectUri());
  if(location.pathname+location.search!==clean.pathname+clean.search)
   history.replaceState(null,"",clean.pathname+clean.search+location.hash);
  return true;
 }catch(e){
  console.warn("Existing LINE session could not be resumed; attempting LIFF");
  return false;
 }
}
function authRecoveryKey(){return "line-saas-reauth-v2:"+slug}
function recoverLineLogin(manual=false){
 const key=authRecoveryKey(),last=Number(sessionStorage.getItem(key)||0);
 if(!manual&&last>0&&Date.now()-last<120000){
  lineLinkStatus="failed";
  lineConnectError="LINE 登入驗證未完成，請按「重新登入 LINE」再試一次。";
  return false;
 }
 sessionStorage.setItem(key,String(Date.now()));
 lineLinkStatus="connecting";
 lineConnectError="資料更新中，請稍後";
 let inClient=false;
 try{inClient=window.liff?.isInClient?.()===true}catch(e){}
 if(inClient||!window.liff){
  location.replace(lineLoginUrl());
  return true;
 }
 try{
  // Only explicitly restart LINE auth when a fresh session cannot be
  // recovered. Do not sign out returning customers on each page load.
  if(window.liff.isLoggedIn?.())window.liff.logout();

  location.replace(lineLoginUrl());

}
async function connectLineSession(force=false){
  if(!(view==="customer"||(view==="staff"&&recoveryMode))||!session?.access_token)return;
  if(force)lineLinkAttempted=false;

  lineLinkStatus="connecting";
  lineConnectError="";

    // A previously verified Supabase browser session does not need LINE
    // OAuth again on each visit, even after the short-lived LIFF token expires.
    if(!force&&await resumeVerifiedLineSession())return;
    if(!window.liff){
      for(let attempt=0;attempt<40&&!window.liff;attempt++)await new Promise(resolve=>setTimeout(resolve,100));
    }
    if(!window.liff)throw Error("LINE 登入元件未能載入。");
    await window.liff.init({liffId:config.liffId});
    // Resolve final merchant after LIFF init completes its secondary redirect.
    refreshLiffRoute();
    if(lineConfigSlug!==slug){
      // A LIFF redirect can restore merchant from liff.state.
      lineConfig=null;lineConfigSlug="";
    }
    if(!window.liff.isLoggedIn()){
      lineLinkStatus="not-logged-in";
      if(!window.liff.isInClient())window.liff.login({redirectUri:cleanLineRedirectUri()});
      return;
    }
    const idToken=window.liff.getIDToken()||"";
    const accessToken=window.liff.getAccessToken()||"";
    if(!idToken&&!accessToken){
      recoverLineLogin(force);
      return;
    }
    const link=async()=>{
      const res=await fetch(LINE_BRIDGE_URL,{
        method:"POST",
        headers:{"content-type":"application/json","authorization":"Bearer "+session.access_token},
        body:JSON.stringify({action:"link",slug,idToken,accessToken})
      });
      return {res,result:await res.json()};
    };
    let {res,result}=await link();
    if(res.status===409&&result.error==="LINE_ACCOUNT_CHANGED"&&session.user?.is_anonymous){
      const signedOut=await supa.auth.signOut();
      if(signedOut.error)throw signedOut.error;
      const fresh=await supa.auth.signInAnonymously();
      if(fresh.error||!fresh.data.session)throw fresh.error||Error("無法建立顧客識別");
      session=fresh.data.session;
      ({res,result}=await link());
    }
    if(!res.ok||!result.linked){
      const refreshable=["LINE_ID_TOKEN_EXPIRED","LINE_ACCESS_TOKEN_EXPIRED","INVALID_LINE_ID_TOKEN","LINE_ACCESS_TOKEN_REQUIRED","LINE_LOGIN_TOKEN_REQUIRED"];
      if(refreshable.includes(result.error)){
        recoverLineLogin(force);
        return;
      }
      const reasons={
       LINE_ID_TOKEN_EXPIRED:"LINE 登入憑證已過期，請重新登入 LINE 後再開啟顧客網址。",
       LINE_ID_TOKEN_AUDIENCE_MISMATCH:"LINE 登入頻道與憑證不一致，請使用專屬 LINE 顧客網址重新登入。",
       INVALID_LINE_ID_TOKEN:"LINE 身分憑證無法通過驗證，請在 LINE App 內重新開啟顧客網址。"
      };
      throw Error(reasons[result.error]||result.error||"LINE 身分驗證失敗");
    }
    acceptVerifiedLineIdentity(result);
  }catch(e){
    const message=e instanceof Error?e.message:String(e);
    // Stale PKCE verifier/state from a previous callback is recoverable.
    // Restart once from a clean LIFF URL; never loop indefinitely.
    if(!force&&/code_verifier|pkce|invalid.*state|state.*mismatch/i.test(message)
       &&recoverLineLogin(false))return;
    lineLinkStatus="failed";
    lineConnectError=/code_verifier|pkce/i.test(message)?
      "LINE 登入驗證已失效，請重新登入 LINE。":message;
    console.warn("LINE 身分連接失敗",lineConnectError);
  }
}

const liffArgs=new URLSearchParams(liffState.includes("?")?liffState.slice(liffState.indexOf("?")+1):"");
// On LIFF redirects, query parameters added to the LIFF URL follow any
// query parameters already present on the configured Endpoint URL.
function lastParam(query,key){const values=query.getAll(key);return values.length?values[values.length-1]:null}
function incomingParam(key){return lastParam(liffArgs,key)||lastParam(params,key)}
function isSafeMerchant(value){return typeof value==="string"&&/^[a-z0-9][a-z0-9-]{2,39}$/.test(value)}
function refreshLiffRoute(){
 const live=new URLSearchParams(location.search);
 const rawState=live.get("liff.state")||"";
 const stateQuery=new URLSearchParams(rawState.includes("?")?rawState.slice(rawState.indexOf("?")+1):"");
 const nextMerchant=lastParam(stateQuery,"merchant")||lastParam(live,"merchant");
 if(isSafeMerchant(nextMerchant))slug=nextMerchant;
 const nextView=lastParam(stateQuery,"view")||lastParam(live,"view");
 if(["customer","staff","platform","home"].includes(nextView))view=nextView;
 if(lastParam(stateQuery,"recover")==="1"||lastParam(live,"recover")==="1")recoveryMode=true;
 const nextTab=lastParam(stateQuery,"tab")||lastParam(live,"tab");
 if(["home","reserve","queue","mine","progress"].includes(nextTab))customerTab=nextTab;
 const newTicket=lastParam(stateQuery,"ticket")||lastParam(live,"ticket");
 if(/^[0-9a-f-]{36}$/i.test(newTicket||"")){
   progressTicketId=newTicket;
   if(nextTab==="progress")customerTab="progress";
 }
 const newKind=lastParam(stateQuery,"manage")||lastParam(live,"manage");
 const newItem=lastParam(stateQuery,"item")||lastParam(live,"item");
 const newMode=lastParam(stateQuery,"mode")||lastParam(live,"mode");
 if(["reservation","ticket"].includes(newKind)&&/^[0-9a-f-]{36}$/i.test(newItem||"")){
   manageKind=newKind;manageItem=newItem;
   manageMode=["edit","cancel","view"].includes(newMode)?newMode:"view";
   customerTab="mine";
 }
 // Only normalize our own duplicate query keys after LIFF has initialized.
 // Keep all LINE SDK query keys (liff.*, access_token, etc.) untouched.
 const normalized=new URL(location.href);
 for(const key of ["view","merchant","tab"]){
   const values=normalized.searchParams.getAll(key);
   if(values.length>1){
     const value=key==="merchant"?slug:key==="view"?view:customerTab;
     normalized.searchParams.delete(key);
     normalized.searchParams.set(key,value);
   }
 }
 if(normalized.href!==location.href)history.replaceState(null,"",normalized.pathname+normalized.search+normalized.hash);
}

async function fetchBookingEditSlots(){

async function refreshQueueProgress(){
 if(view!=="customer"||customerTab!=="progress"||lineLinkStatus!=="linked"||queueLiveLoading)return;
 const shop=slug;
 queueLiveLoading=true;
 try{
  const data=await rpc("so_queue_live",{p_slug:shop,p_ticket_id:queueTicketToDisplay()});
  if(view!=="customer"||customerTab!=="progress"||slug!==shop)return;
  queueLive=data;queueLiveShop=shop;queueLiveError="";
  render();
  if(data?.tenant_id&&queueRealtimeTenant!==data.tenant_id){
    stopQueueRealtime();
    queueRealtimeTenant=data.tenant_id;
    queueRealtimeChannel=supa.channel("queue-display-"+data.tenant_id)
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"so_queue_displays",
        filter:"tenant_id=eq."+data.tenant_id},()=>{void refreshQueueProgress();})
      .subscribe();
  }
 }catch(e){
  if(view==="customer"&&customerTab==="progress"&&slug===shop){
    queueLiveError="進度暫時無法同步，請點重新整理。";
    render();
  }
 }finally{queueLiveLoading=false;}
}

}
function syncCrossQueueRealtime(){
 if(view!=="customer"||customerTab!=="progress"||(progressTicketId||crossCurrentStore)||lineLinkStatus!=="linked"){
   stopCrossQueueRealtime();return;
 }
 const ids=[...new Set((customerActivity?.tickets||[])
   .filter(x=>["WAITING","CALLED","SERVING"].includes(x.status))
   .map(x=>x.tenant_id).filter(x=>/^[0-9a-f-]{36}$/i.test(x||"")))].sort().slice(0,20);
 const nextKey=ids.join(",");
 if(nextKey===crossRealtimeKey)return;
 stopCrossQueueRealtime();
 if(!ids.length)return;
 crossRealtimeKey=nextKey;
 const ch=supa.channel("customer-cross-store-queues");
 for(const id of ids){
   ch.on("postgres_changes",{event:"UPDATE",schema:"public",table:"so_queue_displays",
      filter:"tenant_id=eq."+id},()=>{void refreshCrossStoreOverview();});
 }
 crossRealtimeChannel=ch.subscribe();
}

   if(view!=="customer"||slug!==currentSlug)return;
   customerActivity=activity||{tickets:[],reservations:[]};customerActivityError="";

 const s=await supa.auth.getSession();if(s.error)throw s.error;session=s.data.session;

 if(view==="staff"&&recoveryMode&&lineLinkStatus==="linked"){

 }
 if(view!=="customer"){await bridgeConfig();await loadContext();}
 // Recover an already-authorized original test manager after the local UI

 if(view==="staff"&&!recoveryMode&&!testMode&&session?.user?.is_anonymous){
   const original=context?.memberships?.find(m=>m.slug===ORIGINAL_QA_STORE);
   if(original){
     testInfo={slug:ORIGINAL_QA_STORE};testMode=true;
     localStorage.setItem(TEST_KEY,JSON.stringify(testInfo));
     slug=ORIGINAL_QA_STORE;
     history.replaceState(null,"",route("staff",slug));
   }
 }
  if(testMode&&view!=="customer"&&session?.user?.is_anonymous){
   const membership=context?.memberships?.find(m=>m.slug===testInfo?.slug);
   if(!membership){testMode=false;testInfo=null;localStorage.removeItem(TEST_KEY)}
   else{
    if(view==="platform"&&!platformReady()){await rpc("so_test_login",{p_view:"PLATFORM"});await loadContext()}

    }
   }
  }
 if(view==="customer"){
   customer=lineLinkStatus==="linked"?await rpc("so_public_state",{p_slug:slug,p_date:day}):null;

     try{

     }

   if(customer&&customerTab==="reserve"&&!customer.tenant.modules?.reservation)customerTab="home";
   if(customer&&customerTab==="queue"&&!customer.tenant.modules?.queue)customerTab="home";
   if(customer&&manageKind==="reservation"&&manageMode==="edit"&&manageItem&&editingBookingId!==manageItem){
     const rec=(customer.my_reservations||[]).find(x=>x.id===manageItem&&x.status==="CONFIRMED");
     if(rec){
       editingBookingId=rec.id;editDate=String(rec.day);editTime=String(rec.time);editParty=Number(rec.party);
       editChosenItems=Array.isArray(rec.selected_items)?rec.selected_items.map(x=>x.id):[];

 if(view==="platform"&&platformReady())overview=await rpc("so_platform_overview");
 if(view==="staff"&&authReady()&&(context?.platform_admin||context?.memberships?.some(m=>m.slug===slug))){

 ]);
 staff={...meta,...work,bookingPolicy:policy,reservations:(work.pending_reservations||[]).concat(work.processed_reservations||[]),

 if(staffTab==="analytics"&&["OWNER","MANAGER","PLATFORM"].includes(staff.role))
   staffAnalytics=await rpc("so_staff_analytics",{p_slug:slug,p_days:analyticsDays});

}
 else if(view==="staff")staff=null;
 }catch(e){err=e.message||String(e)}render();
 if(view==="customer"&&customerTab==="progress"&&lineLinkStatus==="linked"&&(progressTicketId||crossCurrentStore)){
   stopCrossQueueRealtime();

async function act(fn){if(busy)return;busy=true;err="";flash="";showActionFeedback("正在儲存，請勿重複點擊。","pending");
 document.querySelectorAll("button[data-act],input[data-status-kind],input[data-delete-kind]").forEach(x=>x.disabled=true);
 try{const m=await fn();await load();flash=m||"已成功儲存";
 const hasNoticeProblem=/提醒暫時無法送出|LINE 通知失敗|LINE 通知暫時|官方帳號查詢失敗/.test(flash);
 showActionFeedback(flash,hasNoticeProblem?"warning":"success")}
 catch(e){err=e.message||String(e);showActionFeedback(err,"error")}
 finally{busy=false;render()}
}

    {p_slug:slug,p_ticket_id:id,p_status:desired,p_expected_status:previous};
   const result=await rpc(procedure,args);
   const label=kind==="ticket"?(staff?.tickets||[]).find(x=>x.id===id)?.number:
    (staff?.reservations||[]).find(x=>x.id===id)?.name;
   if(result.changed)lastStaffChange={kind,id,label:label||(kind==="ticket"?"號碼牌":"預約"),before:previous,after:desired,slug,day};
   let msg=(kind==="ticket"?"號碼牌 ":"預約 ")+(label||"")+"：已改為「"+jsStatus(desired)+"」";
   if(kind==="reservation"&&desired==="CHECKED_IN")msg+="，已完成預約報到（不會自動取號）";
   if(kind==="ticket"&&desired==="CALLED"&&result.changed)
     msg+="；"+await notifyLineCalled(result.number,result.ticket_id,result.line_call_event_id);
   if(result.changed&&desired==="CANCELLED"){
     const notice=kind==="ticket"
       ?await sendLineNotice("notify-ticket-cancel",{ticketId:id})
       :await sendLineNotice("notify-reservation-cancel",{reservationId:id});
     msg+=customerNoticeSuffix(notice);
   }
   if(result.changed&&kind==="reservation"&&previous==="CANCELLED"&&desired==="CONFIRMED"){
     // Restored reservations reuse the existing booking confirmation LINE card.
     const notice=await sendLineNotice("notify-reservation-restored",{reservationId:id});
     msg+="；"+notice;
   }
   return msg;
  });return;
 }
});

window.addEventListener("focus",()=>{if(!busy&&["customer","staff","platform"].includes(view))load()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&view==="customer"&&customerTab==="progress"){if(progressTicketId||crossCurrentStore)void refreshQueueProgress();else void refreshCrossStoreOverview();}});
setInterval(()=>{if(!document.hidden&&!busy&&view==="customer"&&customerTab==="progress"&&(progressTicketId||crossCurrentStore))void refreshQueueProgress();},6000);
setInterval(()=>{if(!document.hidden&&!busy&&!document.activeElement?.matches("input,select,textarea")&&(["customer","staff","platform"].includes(view)))load()},15000);
load();
