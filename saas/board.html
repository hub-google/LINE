<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="line-saas-build" content="13827253cd42ecaafdde94f483950a712e8492fa">
  <script defer src="./version-watch.js?build=13827253cd42ecaafdde94f483950a712e8492fa"></script>
  <meta name="theme-color" content="#113d38">
  <title>排隊怪獸｜即時叫號看板</title>
  <meta name="description" content="店內電視專用即時叫號看板，顯示目前號碼與下一批候位排序。">
  <link rel="stylesheet" href="./assets/board/page-UUVLKVKQ.css?build=13827253cd42ecaafdde94f483950a712e8492fa">
<link rel="stylesheet" href="./site-auth.css"><script defer src="./site-auth.js"></script><link rel="stylesheet" href="./monster-world.css?build=13827253cd42ecaafdde94f483950a712e8492fa"><link rel="icon" type="image/svg+xml" href="./monster-mascot.svg"></head>
<body data-monster-page="board">
  <header>
    <div class="shop-title"><span class="shop-icon" aria-hidden="true">▤</span><h1 id="shop">正在讀取門市資料</h1></div>
    <div class="site-auth-slot site-auth-dark" id="site-auth-root" aria-label="使用者登入狀態"><a class="site-auth-button site-auth-login" href="./directory.html?mode=search">使用 LINE 登入</a></div><time id="clock" aria-label="目前時間">--:--</time>
  </header>
  <section id="unit-board" hidden aria-label="多服務單位即時叫號"></section>
  <main id="single-board" aria-label="店內即時叫號資訊">
    <section class="panel current">
      <div class="label">目前叫號</div>
      <div class="underline" aria-hidden="true"></div>
      <div id="current" aria-live="polite" aria-atomic="true">—</div>
    </section>
    <section class="panel next">
      <div class="label">接下來等候排序</div>
      <div class="underline" aria-hidden="true"></div>
      <ol id="upcoming" aria-label="實際等候順序"><li class="empty">資料更新中</li></ol>
    </section>
  </main>
  <footer>
    <span id="health" data-state="loading" role="status" aria-live="polite">資料更新中</span>
    <span class="footer-note">叫號順序將依現場狀況即時更新</span>
    <div class="board-controls"><button type="button" id="refresh">重新整理</button><button type="button" id="fullscreen">全螢幕</button></div>
    <span id="notice">目前叫號與等待順序皆由門市資料同步，不顯示顧客個資。</span>
  </footer>
  <script type="module" src="./assets/board/main-QXPFEKNY.js?build=13827253cd42ecaafdde94f483950a712e8492fa"></script>
</body>
</html>
