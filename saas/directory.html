<body data-monster-page="directory">
<div id="marketing-header"><a href="./home.html">排隊怪獸</a></div>
<header class="page-header">
 <div class="container">
  <div class="hero-heading">
   <h1 class="eyebrow">搜尋店家，立即使用服務</h1>
   <p>預約、現場取號、即時叫號看板，都能從這裡找到。</p>
  </div>
 </div>
</header>
<main class="container">
 <section class="main-panel">
  <div class="explore-view-switch" role="group" aria-label="探索模式"><button type="button" id="explore-switch-list" aria-pressed="true">清單找店家</button><button type="button" id="explore-switch-game" aria-pressed="false">遊戲逛街</button></div>
  <div id="explore-list" class="explore-list">
  <div class="search-wrap">
   <label for="keyword">搜尋店家名稱或地點</label>
   <div class="search-field">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    <input id="keyword" class="search" type="search" placeholder="例如：餐廳名稱、地區、門市" aria-label="輸入店家名稱或地點" autocomplete="off">
   </div>
  </div>
  <details id="explore-filters" class="filter-details" aria-label="搜尋篩選" open>
    <summary class="filter-summary" id="filter-summary">進階篩選 <span class="filter-chevron" aria-hidden="true"></span></summary>
    <div class="explore-filter-row" role="group" aria-label="篩選條件">
    <label>店家類別<select id="explore-category"><option value="全部">全部類別</option></select></label>
    <label>地區<select id="explore-area"><option value="全部">所有地區</option></select></label>
    <label>服務類型<select id="explore-service">
      <option value="全部">全部服務</option><option value="預約">提供預約</option><option value="取號">提供取號</option><option value="點餐">提供線上點餐</option><option value="看板">提供叫號看板</option>
    </select></label>
    <label>排序<select id="explore-sort"><option value="popular">熱門排行</option><option value="name">店家名稱</option><option value="category">依店家分類</option></select></label>
    </div>
   </details>
   <div class="intro-row">
    <div id="intro" class="intro-copy" role="status"><strong>正在載入店家</strong><p>資料更新中，請稍後。</p></div>
    <span class="public-note">公開看板</span>
   </div>
  <div class="results-header"><h2 id="results-heading">熱門店家排行</h2><span id="result-count" class="result-count" aria-live="polite">載入中</span></div>
  <div class="merchant-grid" id="results" aria-live="polite"></div>
  <div id="result-pages" class="result-pages hidden" aria-label="搜尋結果分頁">
    <button type="button" id="page-prev">上一頁</button><span id="page-label">第 1 頁</span>
    <button type="button" id="page-next">下一頁</button>
  </div>
  </div>
  <section id="explore-game" class="explore-game" hidden aria-label="像素城市探索店家">
    <div class="arcade-top">
      <div class="arcade-heading"><h2>找店家遊戲</h2><p>拖曳地圖自由探索，點選店家即可走進店內。</p></div>
      <div class="arcade-top-actions"><label for="arcade-game-categories">分類</label><select id="arcade-game-categories" aria-label="依店家分類篩選"><option value="全部">全部類別</option></select></div>
    </div>
    <div id="explore-world" class="arcade-map-viewport" tabindex="0" aria-label="可拖曳縮放的像素城市地圖。點選彩色店家標籤進店，方向鍵移動地圖">
      <div id="arcade-map-layer" class="arcade-map-layer">
        <svg id="arcade-city-svg" viewBox="0 0 2400 1500" width="2400" height="1500" aria-hidden="true" focusable="false"></svg>
        <div id="arcade-map-pins" class="arcade-map-pins"></div>
        <div id="arcade-map-cars" class="arcade-map-cars" aria-hidden="true"></div>
      </div>
      <div class="arcade-map-topline"><span class="arcade-live-indicator"></span><span id="arcade-region-count" aria-live="polite">正在載入店家</span></div>
      <div class="arcade-map-hint">拖曳平移 · 滾輪／雙指縮放 · 點選店家進入</div>
      <div class="arcade-map-tools" role="group" aria-label="地圖縮放">
        <button type="button" id="arcade-zoom-in" aria-label="放大地圖">+</button>
        <button type="button" id="arcade-zoom-out" aria-label="縮小地圖">−</button>
        <button type="button" id="arcade-zoom-reset" aria-label="回到地圖中心">⌖</button>
      </div>
      <div class="arcade-map-dpad" role="group" aria-label="移動地圖">
        <button type="button" data-map-pan="up" aria-label="地圖向上移動">↑</button>
        <div><button type="button" data-map-pan="left" aria-label="地圖向左移動">←</button><button type="button" data-map-pan="down" aria-label="地圖向下移動">↓</button><button type="button" data-map-pan="right" aria-label="地圖向右移動">→</button></div>
      </div>
    </div>
    <section id="explore-street" class="arcade-interior" hidden aria-label="店家像素室內場景">
      <div class="arcade-room-header"><button type="button" id="arcade-back">← 返回城市地圖</button><div><h3 id="arcade-street-name"></h3><p id="arcade-street-meta"></p></div></div>
      <div id="arcade-room-view" class="arcade-room-view" tabindex="0" aria-label="店內可操作角色，方向鍵移動">
        <svg id="arcade-room-art" viewBox="0 0 960 570" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <div id="arcade-room-avatar" class="arcade-room-avatar" aria-hidden="true"></div>
      </div>
      <div id="arcade-shop-info" class="arcade-panel arcade-service-dock" role="region" aria-label="店家可使用的服務" aria-live="polite"></div>
      <div class="arcade-room-bottom"><span>使用方向鍵或下方按鈕走動探索店內</span><div class="arcade-controls" role="group" aria-label="控制角色移動"><button type="button" data-walk="left">←</button><button type="button" data-walk="up">↑</button><button type="button" data-walk="down">↓</button><button type="button" data-walk="right">→</button></div></div>
    </section>
    <p id="explore-game-note" class="explore-help">此為遊戲式探索地圖，非實際地理位置。彩色標籤皆對應平台真實公開店家，預約、取號及訂餐使用原本的店家服務。</p>
  </section>

 </section>
