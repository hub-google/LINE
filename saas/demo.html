<h1>你的店，也能<span>更從容。</span></h1>
<p>先從叫號開始，也能直接切換點餐或預約。選擇情境後立即操作，不必再點進門市首頁。完成操作後可以免費建立自己的店家。LINE 訊息為條件式示意，正式推播僅使用店家自行綁定的 LINE OA。</p>
<div class="demo-scenes" aria-label="試用情境">
<button class="demo-scene active" data-scene="repair" aria-pressed="true"><span class="demo-scene-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5a5 5 0 0 0-6 6L4 17a2 2 0 1 0 3 3l4.5-4.5a5 5 0 0 0 6-6L14 12l-2-2z"/></svg></span><span class="demo-scene-copy"><strong>維修店</strong><small>取號、叫號、過號恢復</small></span></button>
<button class="demo-scene" data-scene="breakfast" aria-pressed="false"><span class="demo-scene-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16M5 10l2-5h10l2 5M4 10l2 8h12l2-8M9 14h6M7 20h10"/></svg></span><span class="demo-scene-copy"><strong>早餐店</strong><small>線上點餐、取餐進度</small></span></button>
