<header class="top"><div class="wrap topin"><a class="logo" href="./home.html"><img alt="" src="./monster-mascot.svg"><span>排隊怪獸</span></a><div class="toplinks"><a class="link" href="./home.html">回首頁</a><a class="link" href="./merchant-center.html#apply">建立我的店家</a></div></div></header>
<main>
<section class="wrap hero">
<span class="eyebrow">免登入 · 立即操作 · 免費體驗</span>
<h1>看看你的店，<br><em>如何少一點排隊、多一點效率。</em></h1>
<p>選一種店家情境，直接模擬顧客下單、預約、抽號，再切換店員端操作接單、報到和叫號。所有資料只存在這個試用頁中，不會產生真實訂單或寫入正式資料庫。</p>
<div class="feature-pills"><span>無需 LINE 授權</span><span>顧客與店員雙端操作</span><span>四種常見店家</span><span>可隨時重設</span></div>
</section>
<section class="wrap" aria-label="選擇試用產業">
<div class="scene-grid" id="scenes">
<button type="button" class="scene active" data-scene="breakfast" aria-pressed="true"><span class="emoji" aria-hidden="true">🥪</span><strong>早餐店</strong><small>線上點餐 · 指定取餐時間</small></button>
<button type="button" class="scene" data-scene="salon" aria-pressed="false"><span class="emoji" aria-hidden="true">✂️</span><strong>美髮店</strong><small>預約服務 · 設計師 · 報到</small></button>
<button type="button" class="scene" data-scene="repair" aria-pressed="false"><span class="emoji" aria-hidden="true">🔧</span><strong>維修店</strong><small>現場取號 · 即時叫號</small></button>
<button type="button" class="scene" data-scene="clinic" aria-pressed="false"><span class="emoji" aria-hidden="true">🏥</span><strong>診所</strong><small>預約 + 報到 + 多診間叫號</small></button>
</div>
<section class="work" aria-labelledby="work-title">
<div class="work-head"><div><h2 id="work-title">早餐店｜線上點餐</h2><p id="work-sub">點一次訂餐，再切換店員端處理訂單。</p></div><div class="roles" role="group" aria-label="切換操作身分"><button type="button" class="role active" data-role="customer" aria-pressed="true">顧客端</button><button type="button" class="role" data-role="staff" aria-pressed="false">店員端</button></div></div>
<div class="work-main" id="demo-app"></div>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<div class="foot"><p>這是獨立的互動模擬；資料不會傳送到 Supabase、LINE 或其他商家。</p><button type="button" class="secondary" data-action="reset">重設這個情境</button></div>
</section>
</section>
<section class="wrap finish"><h2>操作順手，就開始用在自己的店。</h2><p>不需要購買專用設備，手機、平板或電腦都能進行管理。<br>正式使用時，請由店家入口完成設定。</p><a class="primary" href="./merchant-center.html#apply">建立我的店家</a></section>
</main>
<script>
(function(){
"use strict";

function initial(){return {

};}
var state=initial(),scene="breakfast",role="customer",selectedRoom="1診",notice="";
var meta={breakfast:["早餐店｜線上點餐","模擬顧客預訂取餐，再切換店員端接單、待取或拒單。"],salon:["美髮店｜線上預約","選服務、設計師與時段，店員可調整報到及完成狀態。"],repair:["維修店｜現場叫號","先抽號，再到店員端叫下一位、過號、恢復。"],clinic:["診所｜預約與叫號","先預約、報到進入候診，再按診間分別叫號。"]};
var statusClass={"已報到":"ok","已完成":"ok","待取":"ok","服務中":"ok","已叫號":"warn","待接單":"warn","過號":"bad","拒單":"bad","取消":"bad"};
function esc(value){return String(value==null?"":value).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pill(v){return '<span class="status '+(statusClass[v]||"")+'">'+esc(v)+'</span>';}
function fmt(n,len){return String(n).padStart(len||3,"0");}
function record(title,subtitle,status,buttons){return '<div class="record"><div><strong>'+esc(title)+'</strong><small>'+esc(subtitle)+'</small>'+(buttons?'<div class="actions">'+buttons+'</div>':"")+'</div>'+pill(status)+'</div>';}
function button(text,action,id,value,extra){return '<button type="button" class="secondary '+(extra||"")+'" data-action="'+esc(action)+'"'+(id?' data-id="'+esc(id)+'"':"")+(value?' data-value="'+esc(value)+'"':"")+'>'+esc(text)+'</button>';}
function list(records){return records.length?records.join(""):'<div class="empty">目前沒有紀錄，試著從顧客端新增一筆。</div>';}
function field(title,id,html){return '<div class="field"><label for="'+id+'">'+title+'</label>'+html+'</div>';}
function input(id,placeholder){return '<input id="'+id+'" maxlength="18" placeholder="'+placeholder+'" autocomplete="off">';}
function select(id,values){return '<select id="'+id+'">'+values.map(function(v){return '<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join("")+'</select>';}
function formStart(type){return '<form data-form="'+type+'">';}

function box(title,inner,cls){return '<section class="panel '+(cls||"")+'"><h3>'+title+'</h3>'+inner+'</section>';}
function stat(label,value){return '<div class="stat"><div class="label">'+esc(label)+'</div><strong class="queue-number">'+esc(value)+'</strong></div>';}
function summary(title,inner){return box(title,inner,"muted");}
function breakfast(){
 var d=state.breakfast;
 var orders=d.orders.map(function(o){var controls=role==="staff"?["接單","待取","拒單"].map(function(s){return button(s,"order-status",o.id,s,o.status===s?"chosen":"");}).join(""):"";return record(o.id+"｜"+o.name,o.item+" × "+o.qty+" · "+o.time+" 取餐",o.status,controls);});
 var left=role==="customer"?box("顧客端｜預訂餐點",formStart("breakfast")+'<div class="fields">'+field("稱呼","b-name",input("b-name","例如：林先生"))+field("餐點","b-item",select("b-item",["火腿蛋吐司","培根蛋餅","蘿蔔糕","鮪魚三明治"]))+field("數量","b-qty",select("b-qty",["1","2","3","4"]))+field("取餐時間","b-time",select("b-time",["07:30","07:45","08:00","08:15","08:30","09:00"]))+'</div>'+formEnd("送出模擬訂單")+'<p class="hint">訂單建立後切換店員端，可自由更改「接單／待取／拒單」，包含已接單後拒單。</p>'):box("店員端｜訂單管理",list(orders)+'<p class="hint">三種狀態可以隨時變更，誤操作也可以復原。</p>');
 var right=role==="customer"?summary("我的店裡正在忙什麼？",'<div class="stats">'+stat("目前訂單",d.orders.length)+stat("待取餐",d.orders.filter(function(o){return o.status==="待取";}).length)+'</div>'+list(orders.slice(0,4))):summary("今日訂單概況",'<div class="stats">'+stat("待接單",d.orders.filter(function(o){return o.status==="待接單";}).length)+stat("已接單或待取",d.orders.filter(function(o){return ["接單","待取"].includes(o.status);}).length)+'</div><p class="hint">從顧客端新增的訂單會立即出現在這裡。</p>');
 return left+right;
}
function salon(){
 var d=state.salon;
 var items=d.bookings.map(function(o){var controls=role==="staff"?["已預約","已報到","已完成","取消"].map(function(s){return button(s,"salon-status",o.id,s,o.status===s?"chosen":"");}).join(""):"";return record(o.id+"｜"+o.name,o.service+" · "+o.stylist+" · "+o.time,o.status,controls);});
 var left=role==="customer"?box("顧客端｜線上預約",formStart("salon")+'<div class="fields">'+field("稱呼","s-name",input("s-name","例如：陳小姐"))+field("服務項目","s-service",select("s-service",["洗剪","染髮","燙髮","護髮"]))+field("設計師","s-stylist",select("s-stylist",["Ava","Mina","Ken"]))+field("預約時段","s-time",select("s-time",["今天 14:00","今天 15:00","明天 10:00","明天 11:00","明天 15:30"]))+'</div>'+formEnd("確認模擬預約")+'<p class="hint">同一位設計師同一時段不可重複預約；這裡只示範排程邏輯。</p>'):box("店員端｜預約管理",list(items)+'<p class="hint">已完成或取消的預約不會消失，仍可調回其他狀態。</p>');

 var d=state.clinic,bookings=d.bookings.map(function(o){var controls=role==="staff"?button(o.status==="已報到"?"已報到":"辦理報到","clinic-checkin",o.id,"",o.status==="已報到"?"chosen":"")+["已預約","已完成","取消"].map(function(s){return button(s,"clinic-booking-status",o.id,s,o.status===s?"chosen":"");}).join(""):"";return record(o.id+"｜"+o.name,o.room+" · "+o.time+(o.ticket?" · 候診號碼 "+o.ticket:""),o.status,controls);});
 var inRoom=d.tickets.filter(function(t){return t.room===selectedRoom;});
 var items=inRoom.map(function(o){var controls=role==="staff"?["等候中","已叫號","服務中","已完成","過號"].map(function(s){return button(s,"clinic-ticket-status",o.id,s,o.status===s?"chosen":"");}).join(""):"";return record(o.id+"｜"+o.name,o.room,o.status,controls);});
 var left=role==="customer"?box("顧客端｜門診預約",formStart("clinic")+'<div class="fields">'+field("稱呼","c-name",input("c-name","例如：李小姐"))+field("診間","c-room",select("c-room",["1診","2診"]))+field("預約時段","c-time",select("c-time",["今天 09:30","今天 10:00","今天 10:30","明天 09:30","明天 10:00"]))+'</div>'+formEnd("送出模擬門診預約")+'<p class="hint">預約不會自動取號；到店後需由店員執行「辦理報到」才會加入對應診間候診。</p>'):box("店員端｜門診預約與報到",list(bookings)+'<p class="hint">「辦理報到」只會產生一次候診號碼；已完成與取消可調整狀態。</p>');
 var roomSelect='<div class="room-row"><label for="clinic-room">查看診間</label>'+select("clinic-room",["1診","2診"]).replace('id="clinic-room"','id="clinic-room" class="selector"').replace('<option value="'+(selectedRoom==="2診"?"2診":"1診")+'">','<option value="'+selectedRoom+'" selected>')+'</div>';
 var right=summary("診間叫號進度",roomSelect+'<div class="stats">'+stat("目前叫號",d.current[selectedRoom]||"尚未叫號")+stat("候診中",inRoom.filter(function(t){return t.status==="等候中";}).length+" 位")+'</div>'+(role==="staff"?'<div class="actions">'+button("叫下一位","clinic-next")+button("重叫","clinic-recall")+'</div>':"")+list(items));
 return left+right;
}
function render(){
 document.querySelectorAll("[data-scene]").forEach(function(b){var on=b.dataset.scene===scene;b.classList.toggle("active",on);b.setAttribute("aria-pressed",String(on));});
 document.querySelectorAll("[data-role]").forEach(function(b){var on=b.dataset.role===role;b.classList.toggle("active",on);b.setAttribute("aria-pressed",String(on));});
 document.getElementById("work-title").textContent=meta[scene][0];document.getElementById("work-sub").textContent=meta[scene][1];
 document.getElementById("demo-app").innerHTML=({breakfast:breakfast,salon:salon,repair:repair,clinic:clinic})[scene]();
 var n=document.getElementById("notice");n.textContent=notice;n.hidden=!notice;
}
function inform(s){notice=s;render();}
function findId(arr,id){return arr.find(function(v){return v.id===id;});}
function takeVal(id){return (document.getElementById(id)?.value||"").trim();}
document.addEventListener("click",function(e){
 var sceneBtn=e.target.closest("[data-scene]");if(sceneBtn){scene=sceneBtn.dataset.scene;role="customer";notice="";render();return;}
 var roleBtn=e.target.closest("[data-role]");if(roleBtn){role=roleBtn.dataset.role;notice="";render();return;}
 var btn=e.target.closest("[data-action]");if(!btn)return;
 var a=btn.dataset.action,id=btn.dataset.id,v=btn.dataset.value;
 if(a==="reset"){state[scene]=initial()[scene];notice="已重設這個情境的展示資料";render();return;}
 if(a==="order-status"){var o=findId(state.breakfast.orders,id);if(o)o.status=v;inform(id+" 已更新為「"+v+"」");return;}
 if(a==="salon-status"){var s=findId(state.salon.bookings,id);if(s)s.status=v;inform(id+" 已更新為「"+v+"」");return;}
 if(a==="repair-status"){var t=findId(state.repair.tickets,id);if(t){t.status=v;if(v==="已叫號")state.repair.current=t.id;}inform(id+" 已更新為「"+v+"」");return;}
 if(a==="repair-next"){var next=state.repair.tickets.find(function(t){return t.status==="等候中";});if(!next){inform("目前沒有等候中的號碼");return;}next.status="已叫號";state.repair.current=next.id;inform("目前已叫號 "+next.id);return;}
 if(a==="repair-recall"){inform("重叫 "+(state.repair.current||"目前無號碼")+"（模擬提醒）");return;}
 if(a==="clinic-booking-status"){var b=findId(state.clinic.bookings,id);if(b)b.status=v;inform(id+" 已更新為「"+v+"」");return;}
 if(a==="clinic-checkin"){var b=findId(state.clinic.bookings,id);if(!b)return;if(b.ticket){b.status="已報到";inform("已恢復報到狀態，沿用原候診號碼 "+b.ticket);return;}var number="C"+(b.room==="1診"?"1":"2")+"-"+fmt(state.clinic.seq++);b.status="已報到";b.ticket=number;state.clinic.tickets.push({id:number,name:b.name,room:b.room,status:"等候中"});inform(b.name+" 已報到，候診號碼 "+number);return;}
 if(a==="clinic-ticket-status"){var t=findId(state.clinic.tickets,id);if(t){t.status=v;if(v==="已叫號")state.clinic.current[t.room]=t.id;}inform(id+" 已更新為「"+v+"」");return;}
 if(a==="clinic-next"){var t=state.clinic.tickets.find(function(o){return o.room===selectedRoom&&o.status==="等候中";});if(!t){inform(selectedRoom+" 沒有等候中的病患");return;}t.status="已叫號";state.clinic.current[selectedRoom]=t.id;inform(selectedRoom+" 已叫號 "+t.id);return;}
 if(a==="clinic-recall"){inform(selectedRoom+" 重叫 "+(state.clinic.current[selectedRoom]||"目前無號碼")+"（模擬提醒）");return;}
});
document.addEventListener("change",function(e){if(e.target.id==="clinic-room"){selectedRoom=e.target.value;notice="";render();}});
document.addEventListener("submit",function(e){
 var f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
 var type=f.dataset.form,name,id;
 if(type==="breakfast"){name=takeVal("b-name")||"展示顧客";id="B"+fmt(state.breakfast.seq++);state.breakfast.orders.unshift({id:id,name:name,item:takeVal("b-item"),qty:Number(takeVal("b-qty")),time:takeVal("b-time"),status:"待接單"});inform("模擬訂單 "+id+" 已送出。切換店員端即可接單。");}
 if(type==="salon"){name=takeVal("s-name")||"展示顧客";var stylist=takeVal("s-stylist"),time=takeVal("s-time");if(state.salon.bookings.some(function(b){return b.stylist===stylist&&b.time===time&&!["取消","已完成"].includes(b.status);})){inform("這位設計師的時段已有預約，請更換時段或設計師");return;}id="S"+fmt(state.salon.seq++);state.salon.bookings.unshift({id:id,name:name,service:takeVal("s-service"),stylist:stylist,time:time,status:"已預約"});inform("模擬預約 "+id+" 已建立，切換店員端可辦理報到。");}
 if(type==="repair"){name=takeVal("r-name")||"展示顧客";id="R"+fmt(state.repair.seq++);state.repair.tickets.push({id:id,name:name,issue:takeVal("r-issue"),status:"等候中"});inform("已取得展示號碼 "+id+"，切換店員端體驗叫號。");}
 if(type==="clinic"){name=takeVal("c-name")||"展示病患";id="P"+fmt(state.clinic.bookingSeq++);state.clinic.bookings.unshift({id:id,name:name,room:takeVal("c-room"),time:takeVal("c-time"),status:"已預約",ticket:""});inform("已建立模擬門診預約 "+id+"。切換店員端報到後即可加入候診。");}
});
render();
})();
</script>
</body>
</html>
