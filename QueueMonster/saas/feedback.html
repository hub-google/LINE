<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#462B52">
<title>LINE 客服與意見回饋｜排隊怪獸</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#392d42;background:#fbf9fc}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
main{width:min(480px,100%);background:#fff;border:1px solid #ece4f1;border-radius:24px;padding:32px;box-shadow:0 12px 36px #462b5210;text-align:center}
h1{margin:0 0 18px;font-size:24px}p{line-height:1.8;color:#665970;margin:12px 0}
a{display:inline-block;margin-top:18px;color:#462b52;text-decoration:underline}#fallback[hidden]{display:none}
small{display:block;color:#8d8292;margin-top:24px;line-height:1.6}
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
</head>
<body>
<main>
<h1>排隊怪獸｜LINE 客服與建議</h1>
<p id="status" role="status" aria-live="polite">正在連接 LINE 官方帳號，請稍候…</p>
<a id="fallback" hidden rel="noopener">直接開啟 LINE 官方帳號</a>
<small>透過此入口新增好友，才會收到專屬的意見回饋提示。一般方式加入不受影響。</small>
</main>
<script>
(function(){
  "use strict";
  const BRIDGE="https://unapiwajmgqqtdkixaab.supabase.co/functions/v1/line-bridge";
  const status=document.getElementById("status");
  const fallback=document.getElementById("fallback");
  function error(message){ status.textContent=message;fallback.hidden=!fallback.href; }
  async function run(){
    try {
      const configResponse=await fetch(BRIDGE+"?action=config&site=queue",{cache:"no-store"});
      if(!configResponse.ok)throw new Error("LINE 設定無法取得");
      const config=await configResponse.json();
      if(/^@[a-z0-9_.-]{2,100}$/i.test(String(config.botBasicId||""))){
        fallback.href="https://line.me/R/oaMessage/"+encodeURIComponent(config.botBasicId);
      }
      if(!config.loginReady || !config.loginChannelMatchesLiff ||
         !/^\d{8,}-[A-Za-z0-9]+$/.test(String(config.liffId||""))){
        error("LINE 授權尚未準備完成。可先使用下方連結直接留言。");
        return;
      }
      if(!window.liff)throw new Error("LINE 登入元件未載入");
      await liff.init({liffId:config.liffId});
      if(!liff.isLoggedIn()){
        status.textContent="正在開啟 LINE 登入授權…";
        liff.login({redirectUri:location.origin+"/feedback"});
        return;
      }
      const idToken=liff.getIDToken();
      if(!idToken)throw new Error("LINE 尚未提供身分授權");
      status.textContent="正在開啟 LINE 官方帳號…";
      const response=await fetch(BRIDGE,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"feedback-join-intent",idToken}),
        cache:"no-store"
      });
      const result=await response.json().catch(()=>({}));
      if(!response.ok || !result.ok || !/^https:\/\/line\.me\/R\/(?:ti\/p|oaMessage)\//.test(String(result.oaUrl||""))){
        throw new Error("無法確認加入狀態");
      }
      location.replace(result.oaUrl);
    }catch(e){
      error("目前無法完成來源確認；仍可使用下方連結直接向我們留言。");
    }
  }
  window.addEventListener("load",run,{once:true});
})();
</script>
</body>
</html>
