<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="line-saas-build" content="__LINE_SAAS_BUILD__">
  <meta name="theme-color" content="#523b70">
  <title>設定新密碼｜排隊怪獸 MonsterPort</title>
  <meta name="description" content="排隊怪獸帳號安全驗證與密碼重設。">
  <link rel="icon" type="image/svg+xml" href="./monster-mascot.svg">
  <link rel="stylesheet" href="./assets/password-reset/page.css?build=__LINE_SAAS_BUILD__">
  <script defer src="./version-watch.js?build=__LINE_SAAS_BUILD__"></script>
</head>
<body data-monster-page="password-reset">
  <header class="brand"><a href="./home.html" aria-label="返回排隊怪獸首頁"><img src="./monster-mascot.svg" alt="" width="52" height="48"><span><strong>排隊怪獸</strong><small>QUEUING MONSTER</small></span></a></header>
  <main>
    <section class="reset-card" aria-labelledby="reset-title">
      <div class="eyebrow">帳號安全驗證</div>
      <h1 id="reset-title">設定新密碼</h1>
      <p class="intro">為了保護你的帳號，請先完成連結驗證，再設定新的登入密碼。</p>
      <div id="reset-loading" role="status" aria-live="polite" class="state">
        <div class="spinner" aria-hidden="true"></div>
        <p>正在驗證你的密碼重設連結…</p>
      </div>
      <form id="reset-form" hidden>
        <p class="verified" role="status"><span aria-hidden="true">✓</span> 電子信箱驗證成功</p>
        <label for="new-password">新密碼 <span>至少 8 個字元</span></label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="輸入新密碼">
        <label for="confirm-password">再次輸入新密碼</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required placeholder="再次輸入新密碼">
        <p id="reset-error" class="error" role="alert" hidden></p>
        <button id="reset-submit" class="primary" type="submit">確認設定新密碼</button>
        <p class="hint">完成後請使用新密碼重新登入。</p>
      </form>
      <section id="reset-success" class="state" hidden aria-live="polite">
        <div class="result-icon success-icon" aria-hidden="true">✓</div>
        <h2>密碼設定完成</h2>
        <p>你的新密碼已儲存，現在可以重新登入排隊怪獸。</p>
        <a class="primary link-button" href="./merchant-register.html?mode=login&passwordReset=success">返回登入</a>
      </section>
      <section id="reset-invalid" class="state" hidden aria-live="polite">
        <div class="result-icon invalid-icon" aria-hidden="true">!</div>
        <h2>連結無法使用</h2>
        <p id="invalid-reason">這個重設連結無效或已過期，請重新申請。</p>
        <a class="primary link-button" href="./merchant-register.html?mode=login">重新申請重設連結</a>
      </section>
    </section>
    <p class="footer">MonsterPort · 排隊怪獸帳號安全</p>
  </main>
  <script type="module" src="./assets/password-reset/main.js?build=__LINE_SAAS_BUILD__"></script>
</body>
</html>
