name: Queue Monster iPhone 17 mobile visual audit
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/queue-monster-mobile-qa.yml"
      - ".github/frontend/mobile-audit.mjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install browser dependencies
        run: |
          npm ci --prefix .github/frontend
          npm exec --prefix .github/frontend -- playwright install --with-deps chromium
      - name: Screenshot live booking website using iPhone 17 viewport
        run: node .github/frontend/mobile-audit.mjs
      - name: Upload read-only audit screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-monster-iphone17-screenshots
          path: reports/iphone17-20261110
          if-no-files-found: warn
          retention-days: 30
      - name: Publish screenshots to dedicated QA branch, not production
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/qa-mobile-screenshots:refs/remotes/origin/qa-mobile-screenshots
          pubdir="$RUNNER_TEMP/queue-monster-mobile-screenshots"
          git worktree add --detach "$pubdir" origin/qa-mobile-screenshots
          mkdir -p "$pubdir/reports/iphone17-20261110"
          cp -R reports/iphone17-20261110/. "$pubdir/reports/iphone17-20261110/"
          git -C "$pubdir" add -- reports/iphone17-20261110
          if ! git -C "$pubdir" diff --cached --quiet; then
            git -C "$pubdir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "qa: captured iPhone 17 mobile visual audit"
            git -C "$pubdir" push origin HEAD:qa-mobile-screenshots
          fi
