name: Queue Monster iPhone 17 mobile visual audit
on:
  workflow_run:
    workflows: ["Queue Monster｜排隊怪獸網站自動部署與版本更新"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/queue-monster-mobile-qa.yml"
      - ".github/frontend/mobile-audit.mjs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: queue-monster-mobile-visual-audit
  cancel-in-progress: true
jobs:
  mobile-audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout project source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install browser dependencies
        run: |
          npm ci --prefix .github/frontend
          npm exec --prefix .github/frontend -- playwright install --with-deps chromium
      - name: Confirm production site has finished deploying the triggering commit
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            release=$(curl -fsSL "https://hub-google.github.io/LINE/booking/release.json?qa=${GITHUB_RUN_ID}-${attempt}" || true)
            if printf '%s' "$release" | grep -Fq "$EXPECTED_SHA"; then exit 0; fi
            sleep 4
          done
          echo "Production booking release did not match workflow commit" >&2
          exit 1
      - name: Screenshot live booking website using iPhone 17 viewport
        run: node .github/frontend/mobile-audit.mjs
      - name: Upload read-only audit screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-monster-iphone17-screenshots
          path: reports/iphone17-latest
          if-no-files-found: warn
          retention-days: 30
      - name: Publish screenshots to dedicated QA branch, not production
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/qa-mobile-screenshots:refs/remotes/origin/qa-mobile-screenshots
          pubdir="$RUNNER_TEMP/queue-monster-mobile-screenshots"
          git worktree add --detach "$pubdir" origin/qa-mobile-screenshots
          mkdir -p "$pubdir/reports/iphone17-latest"
          cp -R reports/iphone17-latest/. "$pubdir/reports/iphone17-latest/"
          git -C "$pubdir" add -- reports/iphone17-latest
          if ! git -C "$pubdir" diff --cached --quiet; then
            git -C "$pubdir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "qa: captured iPhone 17 mobile visual audit"
            git -C "$pubdir" push origin HEAD:qa-mobile-screenshots
          fi
