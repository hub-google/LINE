name: LINE 預約網站自動部署與版本更新
on:
  push:
    branches: [main]
    paths:
      - "store-operations/saas/**"
      - "store-operations/tests/saas-contract.test.mjs"
      - ".github/scripts/build-line-saas.mjs"
      - ".github/workflows/line-saas-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: line-saas-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate browser script syntax
        run: |
          node --check store-operations/saas/version-watch.js
          node --check .github/scripts/build-line-saas.mjs
          test -s store-operations/saas/booking-theme.css
      - name: Verify LINE customer and notification contracts
        run: node --test store-operations/tests/saas-contract.test.mjs store-operations/tests/queue-board-contract.test.mjs store-operations/tests/qr-poster-contract.test.mjs store-operations/tests/marketing-home-contract.test.mjs store-operations/tests/booking-branding-contract.test.mjs store-operations/tests/booking-capacity-receipt.test.mjs store-operations/tests/booking-staff-filter-csv.test.mjs store-operations/tests/booking-timestamp-seconds.test.mjs store-operations/tests/staff-reservation-history-contract.test.mjs store-operations/tests/booking-full-history-csv.test.mjs store-operations/tests/staff-booking-calendar-contract.test.mjs store-operations/tests/booking-idempotency-contract.test.mjs store-operations/tests/booking-break-overlap-contract.test.mjs
      - name: Build versioned LINE Pages files
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/build-line-saas.mjs "$RUNNER_TEMP/line-saas-dist"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/index.html"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/home.html"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/board.html"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/poster.html"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/release.json"
          grep -q "booking-theme.css" "$RUNNER_TEMP/line-saas-dist/index.html"
          test -s "$RUNNER_TEMP/line-saas-dist/booking-theme.css"
      - name: Publish /booking/ and keep legacy /saas/ compatible
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          pubdir="$RUNNER_TEMP/line-gh-pages"
          git worktree add --detach "$pubdir" origin/gh-pages
          for product in booking saas; do
            mkdir -p "$pubdir/$product"
            for f in index.html home.html board.html poster.html directory.html merchant-register.html merchant-center.html privacy.html terms.html version-watch.js release.json booking-theme.css; do
              cp "$RUNNER_TEMP/line-saas-dist/$f" "$pubdir/$product/$f"
            done
          done
          # Only touch booking/ and legacy saas/; all other LINE projects are preserved.
          git -C "$pubdir" add -- booking/ saas/
          if git -C "$pubdir" diff --cached --quiet; then
            echo "LINE SaaS pages already current."
            exit 0
          fi
          git -C "$pubdir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "deploy: LINE booking website $GITHUB_SHA"
          git -C "$pubdir" push origin HEAD:gh-pages
          echo "Published /LINE/booking/ and preserved /LINE/saas/ for existing LIFF callbacks and links."
