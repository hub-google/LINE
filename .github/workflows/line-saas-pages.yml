name: Queue Monster｜排隊怪獸網站自動部署與版本更新
on:
  push:
    branches: [main]
    paths:
      - "QueueMonster/saas/**"
      - "QueueMonster/tests/**"
      - "QueueMonster/supabase/migrations/**"
      - ".github/scripts/build-line-saas.mjs"
      - ".github/scripts/frontend-build.mjs"
      - ".github/frontend/**"
      - ".github/workflows/line-saas-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: line-saas-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install frontend build dependencies
        run: npm ci --prefix .github/frontend
      - name: Validate browser script syntax
        run: |
          node --check QueueMonster/saas/version-watch.js
          node --check .github/scripts/build-line-saas.mjs
          node --check QueueMonster/saas/pwa-sw.js
          node --check QueueMonster/saas/explore-game.js
          node --check QueueMonster/saas/site-auth.js
          test -s QueueMonster/saas/booking-theme.css
          test -s QueueMonster/saas/monster-world.css
          test -s QueueMonster/saas/monster-mascot.svg
          test -s QueueMonster/saas/line-app-icon.svg
      - name: Verify LINE customer and notification contracts
        run: node --test QueueMonster/tests/frontend-modules.test.mjs QueueMonster/tests/frontend-build.test.mjs QueueMonster/tests/merchant-onboarding-contract.test.mjs QueueMonster/tests/site-auth-contract.test.mjs QueueMonster/tests/explore-game-interaction.test.mjs QueueMonster/tests/explore-game-contract.test.mjs QueueMonster/tests/no-magic-store-filters.test.mjs QueueMonster/tests/saas-contract.test.mjs QueueMonster/tests/queue-board-contract.test.mjs QueueMonster/tests/poster-removal-contract.test.mjs QueueMonster/tests/marketing-home-contract.test.mjs QueueMonster/tests/booking-branding-contract.test.mjs QueueMonster/tests/booking-capacity-receipt.test.mjs QueueMonster/tests/booking-staff-filter-csv.test.mjs QueueMonster/tests/booking-timestamp-seconds.test.mjs QueueMonster/tests/staff-reservation-history-contract.test.mjs QueueMonster/tests/booking-full-history-csv.test.mjs QueueMonster/tests/staff-booking-calendar-contract.test.mjs QueueMonster/tests/customer-reservation-ics.test.mjs QueueMonster/tests/booking-pwa-contract.test.mjs QueueMonster/tests/queue-ticket-party-size-k03.test.mjs QueueMonster/tests/queue-sync-ux11.test.mjs QueueMonster/tests/booking-idempotency-contract.test.mjs QueueMonster/tests/booking-break-overlap-contract.test.mjs QueueMonster/tests/queue-hold-resume-contract.test.mjs QueueMonster/tests/queue-arrival-admission-contract.test.mjs QueueMonster/tests/queue-selected-call-k10.test.mjs QueueMonster/tests/queue-session-switch-k12.test.mjs QueueMonster/tests/booking-resource-duration-contract.test.mjs QueueMonster/tests/service-units-contract.test.mjs QueueMonster/tests/queue-near-alert-oss-n03.test.mjs QueueMonster/tests/booking-confirmation-fr112.test.mjs QueueMonster/tests/booking-line-reply.test.mjs QueueMonster/tests/store-announcements-fr110.test.mjs QueueMonster/tests/customer-ledger-blacklist-fr109.test.mjs QueueMonster/tests/merchant-brand-profile.test.mjs QueueMonster/tests/shared-customer-links.test.mjs QueueMonster/tests/unified-queue-core.test.mjs QueueMonster/tests/workflow-test-parity.test.mjs QueueMonster/tests/ui-navigation-cleanup.test.mjs QueueMonster/tests/brand-asset-copy.test.mjs QueueMonster/tests/pickup-sitewide-integration.test.mjs QueueMonster/tests/pickup-taiwan-phone.test.mjs QueueMonster/tests/queue-monster-table-prefix.test.mjs QueueMonster/tests/confirmed-queue-pickup-ui-20261112.test.mjs QueueMonster/tests/customer-standalone-details-20261112.test.mjs QueueMonster/tests/schedule-closure-impact-regression.test.mjs QueueMonster/tests/schedule-unit-session-guard.test.mjs QueueMonster/tests/schedule-default-unit-recovery.test.mjs QueueMonster/tests/customer-record-category-tabs.test.mjs QueueMonster/tests/line-last-booking-board-contract.test.mjs
      - name: Build versioned LINE Pages files
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/build-line-saas.mjs "$RUNNER_TEMP/line-saas-dist"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/index.html"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/home.html"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/for-merchants.html"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/for-customers.html"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/demo.html"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/board.html"
          test ! -e "$RUNNER_TEMP/line-saas-dist/poster.html"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/release.json"
          grep -q "booking-theme.css" "$RUNNER_TEMP/line-saas-dist/index.html"
          test -s "$RUNNER_TEMP/line-saas-dist/booking-theme.css"
          test -s "$RUNNER_TEMP/line-saas-dist/monster-world.css"
          test -s "$RUNNER_TEMP/line-saas-dist/monster-mascot.svg"
          test -s "$RUNNER_TEMP/line-saas-dist/line-app-icon.svg"
          test -s "$RUNNER_TEMP/line-saas-dist/explore-game.css"
          test -s "$RUNNER_TEMP/line-saas-dist/explore-game.js"
          test -s "$RUNNER_TEMP/line-saas-dist/site-auth.css"
          test -s "$RUNNER_TEMP/line-saas-dist/site-auth.js"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/line-saas-dist/pwa-sw.js"
          test -s "$RUNNER_TEMP/line-saas-dist/manifest.webmanifest"
          test -s "$RUNNER_TEMP/line-saas-dist/sitemap.xml"
          test -s "$RUNNER_TEMP/line-saas-dist/offline.html"
          test -s "$RUNNER_TEMP/line-saas-dist/pwa-icon-192.png"
          test -s "$RUNNER_TEMP/line-saas-dist/pwa-icon-512.png"
      - name: Verify native modules and production pages in Chromium
        env:
          BROWSER_CHANNEL: chromium
        run: |
          npm exec --prefix .github/frontend -- playwright install --with-deps chromium
          node .github/frontend/browser-smoke.mjs "$RUNNER_TEMP/line-saas-dist"
      - name: Publish /booking/ and keep legacy /saas/ compatible
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          pubdir="$RUNNER_TEMP/line-gh-pages"
          git worktree add --detach "$pubdir" origin/gh-pages
          for product in booking saas; do
            mkdir -p "$pubdir/$product"
            rm -f "$pubdir/$product/poster.html"
            rm -rf "$pubdir/$product/assets/poster"
            cp -R "$RUNNER_TEMP/line-saas-dist/assets" "$pubdir/$product/"
            for f in index.html template.html home.html for-merchants.html for-customers.html demo.html board.html directory.html merchant-register.html platform-login.html merchant-center.html privacy.html terms.html version-watch.js release.json booking-theme.css monster-world.css monster-mascot.svg line-app-icon.svg explore-game.css explore-game.js site-auth.css site-auth.js public-config.js manifest.webmanifest sitemap.xml pwa-sw.js offline.html pwa-icon-192.png pwa-icon-512.png; do
              cp "$RUNNER_TEMP/line-saas-dist/$f" "$pubdir/$product/$f"
            done
          done
          # Only touch booking/ and legacy saas/; all other LINE projects are preserved.
          git -C "$pubdir" add -- booking/ saas/
          if git -C "$pubdir" diff --cached --quiet; then
            echo "LINE SaaS pages already current."
            exit 0
          fi
          git -C "$pubdir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "deploy: LINE booking website $GITHUB_SHA"
          git -C "$pubdir" push origin HEAD:gh-pages
          echo "Published /LINE/booking/ and preserved /LINE/saas/ for existing LIFF callbacks and links."
