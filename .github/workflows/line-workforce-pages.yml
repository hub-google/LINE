name: LINE Workforce GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "workforce-management/**"
      - ".github/workflows/line-workforce-pages.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: line-saas-gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    # Even manual dispatches from release must never overwrite the main-only test site.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate workforce front-end
        run: |
          set -euo pipefail
          node --check workforce-management/app.js
          node --check workforce-management/swap-sync.js
          node --check workforce-management/vendor/qrcode.min.js
          test -s workforce-management/index.html
          test -s workforce-management/style.css
          test -s workforce-management/mini/index.html
          test -s workforce-management/mini/mini.css
          grep -q 'app.js' workforce-management/index.html
          grep -q 'mini.css' workforce-management/mini/index.html
      - name: Validate Cloudflare Work static build locally without triggering Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          node --check workforce-management/cf-pages-build.mjs
          (cd workforce-management && node ./cf-pages-build.mjs)
          test -s workforce-management/dist/index.html
          test -s workforce-management/dist/mini/index.html
      - name: Verify workforce PRD contracts
        run: |
          node --test workforce-management/tests/workforce-prd.test.mjs
          node --test workforce-management/tests/workforce-button-clicks.test.mjs
          node --test workforce-management/tests/workforce-mini-app.test.mjs
          node --test workforce-management/tests/workforce-mini-behavior.test.mjs
          node --test workforce-management/tests/workforce-mini-oa-entry.test.mjs
          node --test workforce-management/tests/workforce-auth-session.test.mjs
          node --test workforce-management/tests/workforce-import-and-swap.test.mjs
      - name: Deploy workforce website and independent WF MINI App to existing gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          pubdir="$RUNNER_TEMP/line-workforce-pages"
          git worktree add --detach "$pubdir" origin/gh-pages
          mkdir -p "$pubdir/workforce"
          cp workforce-management/index.html workforce-management/app.js workforce-management/swap-sync.js workforce-management/style.css "$pubdir/workforce/"
          # Keep CSS and JS from the same deployment; avoid browser stale-cache layout corruption.
          sed -i "s@./style.css@./style.css?v=$GITHUB_SHA@g" "$pubdir/workforce/index.html"
          sed -i "s@./app.js@./app.js?v=$GITHUB_SHA@g" "$pubdir/workforce/index.html"
          mkdir -p "$pubdir/workforce/vendor"
          cp workforce-management/vendor/qrcode.min.js workforce-management/vendor/QR-CODE-LICENSE "$pubdir/workforce/vendor/"
          printf '%s\n' "$GITHUB_SHA" > "$pubdir/workforce/build.txt"
          # Separate LINE MINI App website. Its entry page and stylesheet are independent;
          # only the versioned business logic + database integration are shared.
          mkdir -p "$pubdir/workforce-mini/vendor"
          cp workforce-management/mini/index.html "$pubdir/workforce-mini/index.html"
          cp workforce-management/mini/mini.css "$pubdir/workforce-mini/mini.css"
          cp workforce-management/app.js workforce-management/swap-sync.js workforce-management/style.css "$pubdir/workforce-mini/"
          cp workforce-management/vendor/qrcode.min.js workforce-management/vendor/QR-CODE-LICENSE "$pubdir/workforce-mini/vendor/"
          sed -i "s@./style.css@./style.css?v=$GITHUB_SHA@g" "$pubdir/workforce-mini/index.html"
          sed -i "s@./mini.css@./mini.css?v=$GITHUB_SHA@g" "$pubdir/workforce-mini/index.html"
          sed -i "s@./app.js@./app.js?v=$GITHUB_SHA@g" "$pubdir/workforce-mini/index.html"
          printf '%s\n' "$GITHUB_SHA" > "$pubdir/workforce-mini/build.txt"
          git -C "$pubdir" add -- workforce/ workforce-mini/
          if git -C "$pubdir" diff --cached --quiet; then
            echo "No workforce changes to deploy."
            exit 0
          fi
          git -C "$pubdir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "deploy: workforce $GITHUB_SHA"
          git -C "$pubdir" push origin HEAD:gh-pages
          echo "Workforce website: https://hub-google.github.io/LINE/workforce/"
          echo "LINE MINI App: https://hub-google.github.io/LINE/workforce-mini/"
      # A remote Supabase outage must not suppress a locally validated front-end build.
      # Keep the run failed if the live API is genuinely inaccessible; deploy independently.
      - name: Verify deployed Supabase APIs
        id: live_api_smoke
        timeout-minutes: 3
        continue-on-error: true
        run: |
          node --test workforce-management/tests/workforce-live.test.mjs
      - name: Verify deployed MINI App public configuration and reject anonymous LINE binding
        id: mini_api_smoke
        timeout-minutes: 2
        continue-on-error: true
        run: |
          node --test workforce-management/tests/workforce-mini-live.test.mjs
      - name: Mark MINI App gateway failure
        if: ${{ steps.mini_api_smoke.outcome == 'failure' }}
        run: |
          echo "::error title=WF MINI App gateway verification failed::Check deployed wm-line GET configuration, CORS and unauthorized binding protection."
          exit 1
      - name: Mark remote API smoke failure without concealing deployment
        if: ${{ steps.live_api_smoke.outcome == 'failure' }}
        run: |
          echo "::error title=Workforce public Supabase API unhealthy::Static checks passed and deployment ran, but remote API live acceptance failed. See the earlier step."
          exit 1
