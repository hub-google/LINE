name: Arena｜一次性 Auth 信件設定
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arena-auth-once.yml'
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: 套用 Arena 專屬重設密碼信件並讀回確認
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          token=os.environ.get("SUPABASE_ACCESS_TOKEN","")
          if not token: raise SystemExit("BLOCKED: existing LINE repository secret missing")
          url="https://api.supabase.com/v1/projects/fanffwnhkxpfhttylntw/config/auth"
          def api(method,payload=None):
              request=urllib.request.Request(url, data=json.dumps(payload,ensure_ascii=False).encode() if payload is not None else None, headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"}, method=method)
              try:
                  with urllib.request.urlopen(request,timeout=30) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"Game Auth Management API {method}: HTTP {e.code}") from None
          current=api("GET")
          assert isinstance(current,dict)
          print("PASS: authorized existing Game project management API")
          test_url="https://hub-google.github.io/MonsterArena/"
          live_url="https://arena.monsterport.com/"
          condition='{{ if or (eq .RedirectTo "'+test_url+'") (eq .RedirectTo "'+live_url+'") }}'
          mark="<!-- monster-arena-recovery-v1 -->"
          html="<!doctype html>\n<html lang=\"zh-Hant\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><meta name=\"color-scheme\" content=\"light dark\"><title>怪獸競技場｜重設密碼</title></head>\n<body style=\"margin:0;padding:0;background-color:#080f20;font-family:Arial,'Microsoft JhengHei','PingFang TC',sans-serif;color:#e2e8f0;\">\n<div style=\"display:none;max-height:0;overflow:hidden;opacity:0;\">Monster Arena 帳號安全通知：設定新密碼，繼續你的競技場冒險。</div>\n<table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" style=\"background-color:#080f20;\"><tr><td align=\"center\" style=\"padding:28px 12px;\">\n<table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" style=\"max-width:520px;background-color:#101a2d;border:1px solid #263b53;border-radius:18px;overflow:hidden;\">\n<tr><td align=\"center\" style=\"padding:32px 24px 26px;background-color:#101a2d;border-top:4px solid #06b6d4;border-bottom:1px solid #263b53;\">\n<table role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\"><tr><td align=\"center\" valign=\"middle\" width=\"68\" height=\"68\" style=\"background-color:#0b1325;border:1px solid #0891b2;border-radius:16px;color:#22d3ee;font-size:30px;font-weight:900;letter-spacing:-3px;\">MA</td></tr></table>\n<div style=\"margin-top:16px;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:2px;color:#22d3ee;\">MONSTER ARENA</div>\n<div style=\"margin-top:7px;font-size:14px;letter-spacing:4px;color:#b0c8d9;\">怪獸競技場</div>\n</td></tr>\n<tr><td style=\"padding:32px 26px 28px;\">\n<p style=\"margin:0 0 12px;color:#67e8f9;font-size:12px;font-weight:bold;letter-spacing:2px;\">帳號安全通知 / ACCOUNT SECURITY</p>\n<h1 style=\"margin:0 0 18px;font-size:26px;line-height:1.4;color:#f8fafc;\">重設你的密碼</h1>\n<p style=\"margin:0 0 20px;font-size:15px;line-height:1.9;color:#cbd5e1;\">競技者，你好！<br>我們收到你的怪獸競技場帳號密碼重設申請。請點擊下方按鈕設定新密碼，即可使用原本的帳號繼續遊戲。</p>\n<table role=\"presentation\" width=\"100%\" cellspacing=\"0\" cellpadding=\"0\"><tr><td align=\"center\" bgcolor=\"#0369a1\" style=\"border-radius:10px;background-color:#0369a1;\"><a href=\"{{ .ConfirmationURL }}\" style=\"display:block;padding:16px 20px;font-size:17px;font-weight:bold;line-height:1.5;text-decoration:none;color:#ffffff;border:1px solid #0284c7;border-radius:10px;\">重設密碼</a></td></tr></table>\n<p style=\"margin:20px 0 0;font-size:13px;line-height:1.8;color:#94a3b8;\">此連結僅供本次密碼重設使用，請勿轉寄或分享。若你未提出申請，可以忽略此信件，你的密碼不會因此改變。</p>\n</td></tr>\n<tr><td style=\"padding:20px 26px;border-top:1px solid #263b53;background-color:#0b1325;font-size:12px;line-height:1.8;color:#94a3b8;\"><strong style=\"color:#cbd5e1;\">怪獸競技場 Monster Arena</strong><br><a href=\"https://arena.monsterport.com/\" style=\"color:#67e8f9;\">arena.monsterport.com</a><br>此為系統自動發送的帳號安全通知，請勿直接回覆。</td></tr>\n</table></td></tr></table></body></html>"
          subject="怪獸競技場 Monster Arena｜重設密碼"
          body_key="mailer_templates_recovery_content"
          subject_key="mailer_subjects_recovery"
          old_body=current.get(body_key) or '<h2>Reset password</h2><p>Follow this link to reset your password.</p><a href="{{ .ConfirmationURL }}">Reset password</a>'
          old_subject=current.get(subject_key) or 'Reset your password'
          if mark in old_body:
              assert condition in old_body and condition in old_subject and subject in old_subject,"Existing Arena branch differs; refusing to overwrite"
              new_body=old_body
              new_subject=old_subject
          else:
              new_body=condition+mark+html+"{{ else }}"+old_body+"{{ end }}"
              new_subject=condition+subject+"{{ else }}"+old_subject+"{{ end }}"
          existing=[x.strip() for x in (current.get("uri_allow_list") or "").split(",") if x.strip()]
          # Only add the explicitly requested GitHub Pages test URL; preserve existing entries.
          allow=",".join(dict.fromkeys(existing+[test_url]))
          patch={body_key:new_body,subject_key:new_subject,"uri_allow_list":allow}
          if any(current.get(k)!=v for k,v in patch.items()): api("PATCH",patch)
          after=api("GET")
          for key,val in patch.items():
              assert after.get(key)==val, "Read-back mismatch: "+key
          assert after.get("site_url")==current.get("site_url"),"Site URL changed unexpectedly"
          assert after.get("smtp_host")==current.get("smtp_host") and after.get("smtp_admin_email")==current.get("smtp_admin_email") and after.get("smtp_sender_name")==current.get("smtp_sender_name"),"SMTP changed unexpectedly"
          print("PASS: Arena conditional branded recovery subject and HTML saved and read back; existing other-brand fallback preserved")
          print("PASS: GitHub Pages recovery redirect allowed; existing Site URL and SMTP unchanged")
          print("SMTP custom host configured:",bool(after.get("smtp_host")))
          print("SMTP sender already Arena-branded:", "arena" in (after.get("smtp_sender_name") or "").lower() or "怪獸競技場" in (after.get("smtp_sender_name") or ""))
          PY
