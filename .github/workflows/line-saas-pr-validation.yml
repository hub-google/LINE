name: LINE 預約 PR 獨立驗證
on:
  pull_request:
    paths:
      - "QueueMonster/saas/**"
      - "QueueMonster/tests/**"
      - "QueueMonster/supabase/migrations/**"
      - ".github/scripts/build-line-saas.mjs"
      - ".github/scripts/frontend-build.mjs"
      - ".github/frontend/**"
      - ".github/workflows/line-saas-pages.yml"
      - ".github/workflows/line-saas-pr-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend build dependencies
        run: npm ci --prefix .github/frontend
      - name: Verify existing SaaS and TV board contracts
        run: node --test QueueMonster/tests/frontend-modules.test.mjs QueueMonster/tests/frontend-build.test.mjs QueueMonster/tests/merchant-onboarding-contract.test.mjs QueueMonster/tests/site-auth-contract.test.mjs QueueMonster/tests/explore-game-interaction.test.mjs QueueMonster/tests/explore-game-contract.test.mjs QueueMonster/tests/no-magic-store-filters.test.mjs QueueMonster/tests/saas-contract.test.mjs QueueMonster/tests/queue-board-contract.test.mjs QueueMonster/tests/poster-removal-contract.test.mjs QueueMonster/tests/marketing-home-contract.test.mjs QueueMonster/tests/booking-branding-contract.test.mjs QueueMonster/tests/booking-capacity-receipt.test.mjs QueueMonster/tests/booking-staff-filter-csv.test.mjs QueueMonster/tests/booking-timestamp-seconds.test.mjs QueueMonster/tests/staff-reservation-history-contract.test.mjs QueueMonster/tests/booking-full-history-csv.test.mjs QueueMonster/tests/staff-booking-calendar-contract.test.mjs QueueMonster/tests/customer-reservation-ics.test.mjs QueueMonster/tests/booking-pwa-contract.test.mjs QueueMonster/tests/queue-ticket-party-size-k03.test.mjs QueueMonster/tests/queue-sync-ux11.test.mjs QueueMonster/tests/booking-idempotency-contract.test.mjs QueueMonster/tests/booking-break-overlap-contract.test.mjs QueueMonster/tests/queue-hold-resume-contract.test.mjs QueueMonster/tests/queue-arrival-admission-contract.test.mjs QueueMonster/tests/queue-selected-call-k10.test.mjs QueueMonster/tests/queue-session-switch-k12.test.mjs QueueMonster/tests/booking-resource-duration-contract.test.mjs QueueMonster/tests/service-units-contract.test.mjs QueueMonster/tests/queue-near-alert-oss-n03.test.mjs QueueMonster/tests/booking-confirmation-fr112.test.mjs QueueMonster/tests/store-announcements-fr110.test.mjs QueueMonster/tests/customer-ledger-blacklist-fr109.test.mjs QueueMonster/tests/merchant-brand-profile.test.mjs QueueMonster/tests/shared-customer-links.test.mjs QueueMonster/tests/unified-queue-core.test.mjs QueueMonster/tests/workflow-test-parity.test.mjs QueueMonster/tests/ui-navigation-cleanup.test.mjs QueueMonster/tests/brand-asset-copy.test.mjs
      - name: Verify versioned build without deploying
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node .github/scripts/build-line-saas.mjs /tmp/line-saas-pr-dist
          test -f /tmp/line-saas-pr-dist/board.html
          test ! -e /tmp/line-saas-pr-dist/poster.html
          grep -q "$GITHUB_SHA" /tmp/line-saas-pr-dist/board.html
          test -f /tmp/line-saas-pr-dist/index.html
          test -f /tmp/line-saas-pr-dist/home.html
          test -s /tmp/line-saas-pr-dist/line-app-icon.svg
          test -f /tmp/line-saas-pr-dist/release.json
          test -s /tmp/line-saas-pr-dist/booking-theme.css
          test -s /tmp/line-saas-pr-dist/manifest.webmanifest
          test -s /tmp/line-saas-pr-dist/pwa-sw.js
          test -s /tmp/line-saas-pr-dist/offline.html
          test -s /tmp/line-saas-pr-dist/pwa-icon-192.png
          test -s /tmp/line-saas-pr-dist/pwa-icon-512.png

      - name: Verify native modules and production pages in Chromium
        env:
          BROWSER_CHANNEL: chromium
        run: |
          npm exec --prefix .github/frontend -- playwright install --with-deps chromium
          node .github/frontend/browser-smoke.mjs /tmp/line-saas-pr-dist
