name: LINE OA 憑證同步與後端部署
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/line-oa-deploy.yml'
      - 'QueueMonster/supabase/functions/line-bridge/index.ts'

permissions:
  contents: read

jobs:
  deploy-line:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      LINE_MESSAGING_CHANNEL_ID: ${{ secrets.LINE_MESSAGING_CHANNEL_ID }}
      LINE_MESSAGING_CHANNEL_SECRET: ${{ secrets.LINE_MESSAGING_CHANNEL_SECRET }}
      LINE_MESSAGING_ACCESS_TOKEN: ${{ secrets.LINE_MESSAGING_ACCESS_TOKEN }}
      LINE_LOGIN_CHANNEL_ID: ${{ secrets.LINE_LOGIN_CHANNEL_ID }}
      LINE_LOGIN_CHANNEL_SECRET: ${{ secrets.LINE_LOGIN_CHANNEL_SECRET }}
      LINE_LIFF_ID: ${{ secrets.LINE_LIFF_ID }}
      LINE_PLATFORM_WELCOME_REPLY: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Validate required encrypted secrets without disclosing values
        shell: bash
        run: |
          for key in SUPABASE_ACCESS_TOKEN LINE_MESSAGING_CHANNEL_ID LINE_MESSAGING_CHANNEL_SECRET LINE_MESSAGING_ACCESS_TOKEN LINE_LOGIN_CHANNEL_ID LINE_LIFF_ID; do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing secret::Repository secret $key is not configured"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Check LINE OA command and webhook contract
        run: node --test QueueMonster/tests/line-oa-bot-contract.test.mjs QueueMonster/tests/booking-line-reply.test.mjs
      - name: Deploy backend and sync encrypted LINE configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          {
            printf 'LINE_MESSAGING_CHANNEL_ID=%s\n' "$LINE_MESSAGING_CHANNEL_ID"
            printf 'LINE_MESSAGING_CHANNEL_SECRET=%s\n' "$LINE_MESSAGING_CHANNEL_SECRET"
            printf 'LINE_MESSAGING_ACCESS_TOKEN=%s\n' "$LINE_MESSAGING_ACCESS_TOKEN"
            printf 'LINE_LOGIN_CHANNEL_ID=%s\n' "$LINE_LOGIN_CHANNEL_ID"
            if [ -n "$LINE_LOGIN_CHANNEL_SECRET" ]; then printf 'LINE_LOGIN_CHANNEL_SECRET=%s\n' "$LINE_LOGIN_CHANNEL_SECRET"; fi
            printf 'LINE_LIFF_ID=%s\n' "$LINE_LIFF_ID"
            printf 'LINE_PLATFORM_WELCOME_REPLY=%s\n' "$LINE_PLATFORM_WELCOME_REPLY"
          } > "$secrets_file"
          supabase secrets set --env-file "$secrets_file" --project-ref unapiwajmgqqtdkixaab --yes
          mkdir -p supabase/functions/line-bridge
          cp QueueMonster/supabase/functions/line-bridge/index.ts supabase/functions/line-bridge/index.ts
          supabase functions deploy line-bridge --project-ref unapiwajmgqqtdkixaab --no-verify-jwt --use-api --yes
      - name: Verify configuration and backend reachability without printing keys
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url="https://unapiwajmgqqtdkixaab.supabase.co/functions/v1/line-bridge?action=config"
          response=json.load(urllib.request.urlopen(url, timeout=20))
          assert response.get("liffId")==__import__("os").environ["LINE_LIFF_ID"],"LIFF ID config does not match secret"
          assert response.get("loginReady") is True,"LINE Login is not configured"
          assert response.get("messagingReady") is True,"LINE Messaging is not configured"
          print("LINE bridge config verified; no secrets displayed.")
          PY
      - name: Verify LINE access token and configure webhook securely
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          token = os.environ["LINE_MESSAGING_ACCESS_TOKEN"]
          base = "https://api.line.me"
          endpoint = "https://unapiwajmgqqtdkixaab.supabase.co/functions/v1/line-bridge?action=webhook"
          def api(path, method="GET", body=None):
            data = None if body is None else json.dumps(body).encode("utf-8")
            req = urllib.request.Request(
              base + path, data=data, method=method,
              headers={"Authorization":"Bearer "+token, "Content-Type":"application/json"},
            )
            with urllib.request.urlopen(req, timeout=20) as response:
              return json.loads(response.read().decode("utf-8") or "{}")
          info = api("/v2/bot/info")
          assert info.get("userId", "").startswith("U"), "Messaging API token did not resolve an OA"
          print("LINE Messaging API token is valid (OA identity verified, redacted).")
          try:
            existing = api("/v2/bot/channel/webhook/endpoint")
          except urllib.error.HTTPError as error:
            if error.code != 404:
              raise
            existing = {}
          other = existing.get("endpoint")
          if other and other != endpoint:
            raise RuntimeError("LINE OA already has a DIFFERENT webhook endpoint; refusing to overwrite another service.")
          if other != endpoint:
            api("/v2/bot/channel/webhook/endpoint", "PUT", {"endpoint": endpoint})
          verified = api("/v2/bot/channel/webhook/endpoint")
          assert verified.get("endpoint") == endpoint, "LINE webhook endpoint does not match"
          # LINE sometimes returns statusCode=0 during Edge cold starts. Retry,
          # but never convert a consistently failed webhook test into success.
          import time
          for attempt in range(4):
            checked = api("/v2/bot/channel/webhook/test", "POST", {"endpoint": endpoint})
            if checked.get("success") is True:
              break
            if attempt < 3:
              urllib.request.urlopen(
                "https://unapiwajmgqqtdkixaab.supabase.co/functions/v1/line-bridge?action=config", timeout=20
              ).close()
              time.sleep(2 * (attempt + 1))
          assert checked.get("success") is True, "LINE test webhook failed (HTTP status %s)" % checked.get("statusCode")
          print("Webhook endpoint verified with LINE API; test webhook HTTP %s." % checked.get("statusCode"))
          if not verified.get("active"):
            print("::warning title=Enable LINE webhooks::Webhook URL is configured and tested, but LINE 'Use webhook' is disabled in the OA console.")
          else:
            print("LINE webhook is enabled.")
          PY
      - name: Verify signed webhook and reject forged requests
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, urllib.error, urllib.request
          endpoint = "https://unapiwajmgqqtdkixaab.supabase.co/functions/v1/line-bridge?action=webhook"
          body = b'{"events":[]}'
          signature = base64.b64encode(hmac.new(os.environ["LINE_MESSAGING_CHANNEL_SECRET"].encode(), body, hashlib.sha256).digest()).decode()
          def test(sig):
            req = urllib.request.Request(endpoint, body, method="POST",
              headers={"Content-Type":"application/json", "X-Line-Signature":sig})
            try:
              with urllib.request.urlopen(req, timeout=25) as res:
                return res.status, json.loads(res.read().decode())
            except urllib.error.HTTPError as err:
              return err.code, json.loads(err.read().decode())
          ok_status, ok = test(signature)
          assert ok_status == 200 and ok.get("ok") is True, "Signed webhook verification failed"
          bad_status, _ = test("invalid")
          assert bad_status == 401, "Unsigned or forged LINE event was not rejected"
          print("Signed LINE webhook accepted; forged webhook rejected (401).")
          PY
      - name: Inspect and repair multi-merchant HQ LIFF endpoint, openid and profile scopes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          client_id = os.environ["LINE_LOGIN_CHANNEL_ID"]
          client_secret = os.environ.get("LINE_LOGIN_CHANNEL_SECRET", "")
          liff_id = os.environ["LINE_LIFF_ID"]
          target = "https://hub-google.github.io/LINE/booking/"
          if not client_secret:
            print("::warning title=LIFF read-back unavailable::LINE_LOGIN_CHANNEL_SECRET not configured; check LIFF endpoint and openid scope manually.")
            raise SystemExit(0)
          form = urllib.parse.urlencode({"grant_type":"client_credentials", "client_id":client_id, "client_secret":client_secret}).encode()
          req = urllib.request.Request("https://api.line.me/v2/oauth/accessToken", form, method="POST",
            headers={"Content-Type":"application/x-www-form-urlencoded"})
          with urllib.request.urlopen(req, timeout=25) as res:
            token = json.load(res)["access_token"]
          base = "https://api.line.me/liff/v1/apps"
          def api(path="", method="GET", body=None):
            raw = None if body is None else json.dumps(body).encode()
            request = urllib.request.Request(base+path, raw, method=method,
              headers={"Authorization":"Bearer "+token, "Content-Type":"application/json"})
            with urllib.request.urlopen(request, timeout=25) as response:
              return json.loads(response.read().decode() or "{}")
          apps = api().get("apps", [])
          app = next((a for a in apps if a.get("liffId")==liff_id), None)
          assert app is not None, "Configured LIFF app does not belong to LINE Login channel"
          current_url = (app.get("view") or {}).get("url", "")
          current_scopes = list(app.get("scope") or [])
          updates = {}
          if current_url != target:
            updates["view"] = {"url":target}
          missing_scopes = [scope for scope in ("openid", "profile") if scope not in current_scopes]
          if missing_scopes:
            updates["scope"] = list(dict.fromkeys(current_scopes + missing_scopes))
          if updates:
            api("/"+urllib.parse.quote(liff_id, safe=""),"PUT",updates)
            app = next((a for a in api().get("apps", []) if a.get("liffId")==liff_id), None)
          assert app is not None and app.get("view",{}).get("url")==target, "LIFF endpoint mismatch"
          assert all(scope in (app.get("scope") or []) for scope in ("openid","profile")), "LIFF openid/profile scopes missing"
          print("LIFF endpoint verified; openid and profile scopes enabled. No credentials displayed.")
          PY
