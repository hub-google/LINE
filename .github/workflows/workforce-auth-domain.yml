name: Work｜正式網域 Auth Redirect 安全設定

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Append Work Auth callback safely and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-work-auth-domain.py
