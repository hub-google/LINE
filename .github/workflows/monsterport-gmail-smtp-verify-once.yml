name: MonsterPort｜Gmail SMTP 設定驗收
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monsterport-gmail-smtp-verify-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MONSTERPORT_SMTP_SENDER: monsterport.com@gmail.com
      MONSTERPORT_SMTP_TARGET: queue
    steps:
      - uses: actions/checkout@v4
      - name: 讀取 Vault 憑證並設定排隊怪獸 SMTP
        run: python3 .github/scripts/configure-monsterport-gmail-smtp.py
