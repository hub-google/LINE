name: LINE OA 總公司圖文選單發布
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/line-rich-menu.yml'
      - '.github/scripts/publish_rich_menu.py'

permissions:
  contents: read

concurrency:
  group: line-oa-hq-rich-menu
  cancel-in-progress: false

jobs:
  publish-rich-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINE_MESSAGING_ACCESS_TOKEN: ${{ secrets.LINE_MESSAGING_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify token exists without printing it
        shell: bash
        run: |
          if [ -z "$LINE_MESSAGING_ACCESS_TOKEN" ]; then
            echo "::error title=Missing secret::LINE_MESSAGING_ACCESS_TOKEN has not been configured"
            exit 1
          fi
      - name: Install Chinese font and image renderer
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check Pillow
      - name: Create and publish six-button headquarters rich menu
        run: python3 .github/scripts/publish_rich_menu.py
