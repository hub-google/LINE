name: Queue Monster｜手動發布 Cloudflare 正式版

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '輸入 RELEASE 才將這個 main 版本發布至 Cloudflare 正式站'
        required: true
        type: string
  push:
    branches: [release]
    paths:
      - "QueueMonster/saas/**"
      - "QueueMonster/tests/**"
      - ".github/scripts/build-line-saas.mjs"
      - ".github/scripts/frontend-build.mjs"
      - ".github/frontend/**"
      - ".github/workflows/queue-monster-production-release.yml"

permissions:
  contents: write

# Both test and production update the same gh-pages branch, so serialize commits.
concurrency:
  group: line-saas-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish isolated production snapshot
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/release') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'RELEASE')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the exact requested source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Validate source syntax
        run: |
          node --check .github/scripts/build-line-saas.mjs
          node --check QueueMonster/saas/site-auth.js
          node --check QueueMonster/saas/assets/home/intro-video.js
          node --check QueueMonster/saas/version-watch.js
          node --check QueueMonster/saas/pwa-sw.js
      - name: Install frontend build dependencies
        run: npm ci --prefix .github/frontend
      - name: Run release regression tests
        run: |
          node --test \
            QueueMonster/tests/booking-buttons-regression-20261116.test.mjs \
            QueueMonster/tests/site-auth-contract.test.mjs \
            QueueMonster/tests/marketing-home-contract.test.mjs \
            QueueMonster/tests/intro-video-contract.test.mjs \
            QueueMonster/tests/booking-line-reply.test.mjs \
            QueueMonster/tests/public-customer-routes-20261113.test.mjs \
            QueueMonster/tests/frontend-build.test.mjs \
            QueueMonster/tests/queue-deployment-isolation.test.mjs
      - name: Build versioned production assets
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/build-line-saas.mjs "$RUNNER_TEMP/queue-prod-dist"
          for f in index.html home.html release.json site-auth.js pwa-sw.js booking-theme.css vendor/qrcode.min.js; do
            test -s "$RUNNER_TEMP/queue-prod-dist/$f"
          done
          test -s "$RUNNER_TEMP/queue-prod-dist/assets/videos/intro-video.json"
          grep -q "$GITHUB_SHA" "$RUNNER_TEMP/queue-prod-dist/release.json"
      - name: Publish production snapshot without touching the test site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          pubdir="$RUNNER_TEMP/queue-prod-gh-pages"
          git worktree add --detach "$pubdir" origin/gh-pages
          # Change ONLY /LINE/queue-prod; never alter /LINE/booking or /LINE/saas.
          rm -rf "$pubdir/queue-prod"
          mkdir -p "$pubdir/queue-prod"
          cp -a "$RUNNER_TEMP/queue-prod-dist/." "$pubdir/queue-prod/"
          git -C "$pubdir" add -A -- queue-prod/
          if ! git -C "$pubdir" diff --cached --quiet; then
            git -C "$pubdir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "deploy: Queue Monster production $GITHUB_SHA"
            git -C "$pubdir" push origin HEAD:gh-pages
          fi
          echo "Production snapshot published to /LINE/queue-prod/ at $GITHUB_SHA"
      - name: Advance release branch after successful production upload
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/release:refs/remotes/origin/release
          if ! git merge-base --is-ancestor origin/release HEAD; then
            echo "::error::release is not an ancestor; refusing to force-push."
            exit 1
          fi
          git push origin HEAD:refs/heads/release
          echo "Production approved at $GITHUB_SHA"
