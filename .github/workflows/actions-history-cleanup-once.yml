name: One-time Actions run history cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-history-cleanup-once.yml"
permissions:
  contents: read
  actions: write
concurrency:
  group: onetime-actions-history-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Delete completed workflow history and its artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          own_run_id = str(os.environ["GITHUB_RUN_ID"])
          token = os.environ["GH_TOKEN"]
          root = "https://api.github.com/repos/" + repo
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "queue-monster-one-time-actions-run-cleanup",
          }
          deleted = 0
          blocked = set()
          start = time.time()
          print("START one-time run cleanup: repo=" + repo + "; self=" + own_run_id, flush=True)

          def request(method, path):
              address = root + path
              for attempt in range(12):
                  req = urllib.request.Request(address, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      data = exc.read().decode("utf-8", errors="replace")[:300]
                      remaining = exc.headers.get("X-RateLimit-Remaining")
                      reset = exc.headers.get("X-RateLimit-Reset")
                      if exc.code in (403, 429) and remaining == "0" and reset:
                          delay = max(60, int(reset) - int(time.time()) + 8)
                          print("API rate limit; sleeping " + str(delay) + " seconds", flush=True)
                          time.sleep(delay)
                          continue
                      if exc.code in (429, 500, 502, 503, 504):
                          time.sleep(min(15 * (attempt + 1), 90))
                          continue
                      raise RuntimeError(method + " " + path + " status=" + str(exc.code) + " " + data) from None
                  except (TimeoutError, urllib.error.URLError):
                      time.sleep(min(15 * (attempt + 1), 90))
              raise RuntimeError("API retry exhaustion: " + method + " " + path)

          # Query only completed runs. In-progress deployments must not be disrupted.
          empty_passes = 0
          while time.time() - start < 20000:
              result = request("GET", "/actions/runs?status=completed&per_page=100")
              runs = [str(item["id"]) for item in result.get("workflow_runs", [])
                      if str(item["id"]) != own_run_id and str(item["id"]) not in blocked]
              if not runs:
                  empty_passes += 1
                  if empty_passes >= 3:
                      break
                  time.sleep(15)
                  continue
              empty_passes = 0
              for run_id in runs:
                  try:
                      request("DELETE", "/actions/runs/" + run_id)
                      deleted += 1
                      if deleted % 50 == 0:
                          print("Deleted " + str(deleted) + " completed runs", flush=True)
                  except RuntimeError as exc:
                      blocked.add(run_id)
                      print("Skipped run " + run_id + ": " + str(exc)[:160], flush=True)
                  time.sleep(0.35)

          remaining = request("GET", "/actions/runs?per_page=1").get("total_count", "unknown")
          print("DONE deleted=" + str(deleted) + " remaining_total=" + str(remaining)
                + " blocked=" + str(len(blocked)), flush=True)
          if blocked:
              print("Blocked ids=" + ",".join(sorted(blocked)), flush=True)
          PY
