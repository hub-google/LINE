name: Queue Monster｜品牌影片分享頁與社群縮圖
on:
  push:
    branches: [main]
    paths:
      - "QueueMonster/saas/video.html"
      - "QueueMonster/saas/assets/videos/intro.mp4"
      - "QueueMonster/saas/assets/videos/share-video.css"
      - "QueueMonster/saas/assets/videos/share-video.js"
      - ".github/workflows/queue-monster-video-share.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: line-saas-gh-pages
  cancel-in-progress: false

jobs:
  video-share:
    name: Publish tested share page and film-frame JPEG
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Inspect actual uploaded video
        shell: bash
        run: |
          set -euo pipefail
          src="QueueMonster/saas/assets/videos/intro.mp4"
          test -s "$src"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height -show_entries format=duration -of json "$src"
          node --check QueueMonster/saas/assets/videos/share-video.js

      - name: Generate real JPEG from the uploaded film
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qm-share/assets/videos"
          src="QueueMonster/saas/assets/videos/intro.mp4"
          dir="$RUNNER_TEMP/qm-share/assets/videos"
          # Landscape preview for LINE / social crawlers: real film frame
          # centered over a blurred copy of the frame. Never crop the movie.
          ffmpeg -hide_banner -nostdin -loglevel error -y -ss 2 -i "$src" \
            -filter_complex '[0:v]split=2[b][f];[b]scale=1200:630:force_original_aspect_ratio=increase,crop=1200:630,boxblur=16:2,eq=brightness=-0.16[bg];[f]scale=1100:600:force_original_aspect_ratio=decrease,setsar=1[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2,format=yuv420p[out]' \
            -map '[out]' -frames:v 1 -q:v 4 "$dir/intro-og.jpg"
          # Portrait poster used while the inline video loads on mobile.
          ffmpeg -hide_banner -nostdin -loglevel error -y -ss 2 -i "$src" \
            -vf 'scale=540:960:force_original_aspect_ratio=decrease,pad=540:960:(ow-iw)/2:(oh-ih)/2:color=0x21152d,format=yuv420p' \
            -frames:v 1 -q:v 4 "$dir/intro-poster.jpg"
          test "$(stat -c%s "$dir/intro-og.jpg")" -gt 5000
          test "$(stat -c%s "$dir/intro-poster.jpg")" -gt 3000
          file "$dir/intro-og.jpg" "$dir/intro-poster.jpg"
          cp QueueMonster/saas/assets/videos/share-video.css "$dir/share-video.css"
          cp QueueMonster/saas/assets/videos/share-video.js "$dir/share-video.js"
          cp QueueMonster/saas/video.html "$RUNNER_TEMP/qm-share/video.html"
          sed -i "s/__LINE_SAAS_BUILD__/$GITHUB_SHA/g" "$RUNNER_TEMP/qm-share/video.html"
          grep -F 'property="og:image" content="https://hub-google.github.io/LINE/booking/assets/videos/intro-og.jpg"' "$RUNNER_TEMP/qm-share/video.html"
          grep -F 'property="og:video:type" content="video/mp4"' "$RUNNER_TEMP/qm-share/video.html"

      - name: Publish both compatible test URLs without modifying production
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          pubdir="$RUNNER_TEMP/qm-share-pages"
          git worktree add --detach "$pubdir" origin/gh-pages
          for folder in booking saas; do
            mkdir -p "$pubdir/$folder/assets/videos"
            cp "$RUNNER_TEMP/qm-share/video.html" "$pubdir/$folder/video.html"
            cp "$RUNNER_TEMP/qm-share/assets/videos/intro-og.jpg" "$pubdir/$folder/assets/videos/intro-og.jpg"
            cp "$RUNNER_TEMP/qm-share/assets/videos/intro-poster.jpg" "$pubdir/$folder/assets/videos/intro-poster.jpg"
            cp "$RUNNER_TEMP/qm-share/assets/videos/share-video.css" "$pubdir/$folder/assets/videos/share-video.css"
            cp "$RUNNER_TEMP/qm-share/assets/videos/share-video.js" "$pubdir/$folder/assets/videos/share-video.js"
          done
          git -C "$pubdir" add -- booking/video.html saas/video.html booking/assets/videos/intro-og.jpg saas/assets/videos/intro-og.jpg booking/assets/videos/intro-poster.jpg saas/assets/videos/intro-poster.jpg booking/assets/videos/share-video.css saas/assets/videos/share-video.css booking/assets/videos/share-video.js saas/assets/videos/share-video.js
          if git -C "$pubdir" diff --cached --quiet; then
            echo "Video share assets are already current."
            exit 0
          fi
          git -C "$pubdir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "deploy: Queue Monster video share and social film thumbnail $GITHUB_SHA"
          git -C "$pubdir" push origin HEAD:gh-pages
          echo "Published /LINE/booking/video.html with 1200x630 video-frame Open Graph preview."
