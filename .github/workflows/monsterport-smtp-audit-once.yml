name: MonsterPort｜一次性檢查既有 SMTP 授權
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monsterport-smtp-audit-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MP_SMTP_HOST: ${{ secrets.MONSTERPORT_SMTP_HOST }}
      MP_SMTP_USER: ${{ secrets.MONSTERPORT_SMTP_USER }}
      MP_SMTP_PASS: ${{ secrets.MONSTERPORT_SMTP_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
    steps:
      - name: 僅列印 SMTP 設定是否存在，不輸出任何憑證
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, json
          credentials=('MP_SMTP_HOST','MP_SMTP_USER','MP_SMTP_PASS','SMTP_HOST','SMTP_USER','SMTP_PASS','RESEND_API_KEY','BREVO_API_KEY','SENDGRID_API_KEY','POSTMARK_SERVER_TOKEN')
          print('Credentials present (booleans only):',json.dumps({k:bool(os.getenv(k)) for k in credentials}))
          token=os.getenv('SUPABASE_ACCESS_TOKEN')
          if not token: raise RuntimeError('Existing Supabase Management API token unavailable')
          for name,ref in (('Queue Monster','unapiwajmgqqtdkixaab'),('Monster Arena','fanffwnhkxpfhttylntw')):
              req=urllib.request.Request('https://api.supabase.com/v1/projects/'+ref+'/config/auth',headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response: cfg=json.load(response)
              except urllib.error.HTTPError as e: raise RuntimeError(name+' Auth GET HTTP '+str(e.code)) from None
              print(name+' provider status (booleans only):',json.dumps({
                  'custom_smtp_host_configured':bool(cfg.get('smtp_host')),
                  'custom_smtp_user_configured':bool(cfg.get('smtp_user')),
                  'sender_is_monsterport':cfg.get('smtp_sender_name')=='MonsterPort',
                  'admin_email_is_monsterport':(cfg.get('smtp_admin_email') or '').lower().endswith('@monsterport.com'),
                  'send_email_hook_enabled':bool(cfg.get('hook_send_email_enabled')),
              }))
          PY
