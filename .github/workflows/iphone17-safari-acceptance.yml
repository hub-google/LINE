name: iPhone 17 Safari browser acceptance (read-only)
on:
  push:
    branches: [qa/iphone17-safari-e2e-20261110]
    paths:
      - '.github/frontend/iphone17-safari-acceptance.mjs'
      - '.github/workflows/iphone17-safari-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm ci --prefix .github/frontend
          npm exec --prefix .github/frontend -- playwright install --with-deps chromium webkit
      - name: Run published-site mobile tests (read-only)
        id: test
        continue-on-error: true
        run: node .github/frontend/iphone17-safari-acceptance.mjs
      - name: Upload screenshots + exact failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-monster-iphone17-webkit-chromium-acceptance
          path: reports/iphone17-safari-20261110/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish report on isolated QA branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/iphone17-safari-20261110/ || true
          if ! git diff --cached --quiet; then
            git commit -m "qa: publish iPhone 17 WebKit screenshots and acceptance metrics"
            git push
          fi
      - name: Fail if any acceptance check failed
        if: steps.test.outcome == 'failure'
        run: exit 1
