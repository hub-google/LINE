name: iPhone 17 Safari browser acceptance (read-only)
on:
  push:
    branches: [qa/iphone17-safari-e2e-20261110]
    paths:
      - '.github/frontend/iphone17-safari-acceptance.mjs'
      - '.github/workflows/iphone17-safari-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local test dependencies (browsers preinstalled in pinned image)
        run: npm ci --prefix .github/frontend
      - name: Run published-site mobile tests (read-only)
        id: test
        continue-on-error: true
        run: node .github/frontend/iphone17-safari-acceptance.mjs
      - name: Render synthetic mobile staff + headquarters fixture screens (no real sign-in)
        id: roles
        continue-on-error: true
        run: node .github/frontend/iphone17-role-fixtures.mjs
      - name: Upload screenshots + exact failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-monster-iphone17-webkit-chromium-acceptance
          path: reports/iphone17-safari-20261110/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish report on isolated QA branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin qa/iphone17-safari-e2e-20261110
          pubdir="$RUNNER_TEMP/iphone17-qa-results"
          git worktree add -B qa-report "$pubdir" origin/qa/iphone17-safari-e2e-20261110
          mkdir -p "$pubdir/reports/iphone17-safari-20261110"
          cp -R reports/iphone17-safari-20261110/. "$pubdir/reports/iphone17-safari-20261110/"
          git -C "$pubdir" add reports/iphone17-safari-20261110/
          if ! git -C "$pubdir" diff --cached --quiet; then
            git -C "$pubdir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "qa: publish iPhone 17 WebKit screenshots and acceptance metrics"
            git -C "$pubdir" push origin HEAD:qa/iphone17-safari-e2e-20261110
          fi
      - name: Fail if any acceptance check failed
        if: steps.test.outcome == 'failure' || steps.roles.outcome == 'failure'
        run: exit 1
