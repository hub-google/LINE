name: LINE OA rich menu and webhook contracts
on:
  pull_request:
    paths:
      - '.github/scripts/publish_rich_menu.py'
      - '.github/scripts/test_rich_menu.py'
      - '.github/workflows/line-rich-menu.yml'
      - '.github/workflows/line-oa-deploy.yml'
      - 'QueueMonster/supabase/functions/line-bridge/index.ts'
      - 'QueueMonster/tests/line-oa-bot-contract.test.mjs'
      - 'QueueMonster/saas/directory.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install font and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check Pillow
      - name: Verify Python syntax and two-tab menu
        run: |
          python3 -m py_compile .github/scripts/publish_rich_menu.py
          python3 -m unittest discover -s .github/scripts -p 'test_rich_menu.py' -v
      - name: Verify platform OA intent routing and friend-state constraints
        run: node --test QueueMonster/tests/line-oa-bot-contract.test.mjs QueueMonster/tests/queue-near-alert-oss-n03.test.mjs
      - name: Existing domain regression
        run: npm --prefix QueueMonster test
