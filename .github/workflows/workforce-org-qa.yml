name: Workforce enterprise hierarchy QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workforce-management/tests/workforce-org-seed.mjs"
      - "workforce-management/tests/org-qa-accounts.mjs"
      - "workforce-management/tests/workforce-org-hierarchy-e2e.mjs"
      - ".github/workflows/workforce-org-qa.yml"
permissions:
  contents: read
concurrency:
  group: workforce-org-hierarchy-qa
  cancel-in-progress: false
jobs:
  org-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check management credential is present
        run: test -n "$SUPABASE_ACCESS_TOKEN"
      - name: Seed real but fictional, isolated QA tenants and accounts
        run: node workforce-management/tests/workforce-org-seed.mjs
      - name: Install Playwright browser runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute hierarchy, authorization and UI acceptance
        run: node workforce-management/tests/workforce-org-hierarchy-e2e.mjs
      - name: Archive actual browser screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workforce-enterprise-hierarchy-qa
          path: workforce-management/org-qa-artifacts/
          retention-days: 30
          if-no-files-found: warn
