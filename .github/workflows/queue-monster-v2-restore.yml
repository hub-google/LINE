name: QueueMonster V2 restore and publish
on:
  push:
    branches: [main]
    paths:
      - ".github/video-v2-chunks/**"
      - ".github/workflows/queue-monster-v2-restore.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Restore exact user-provided V2 MP4 and verify
        shell: bash
        run: |
          set -euo pipefail
          cat .github/video-v2-chunks/part-* > QueueMonster/saas/assets/videos/intro.mp4
          echo "203ad8a2949a8633db6d458f49512ca41d2dc41ec97041ab52bc0f4733e4c393  QueueMonster/saas/assets/videos/intro.mp4" | sha256sum -c -
          test "$(stat -c %s QueueMonster/saas/assets/videos/intro.mp4)" -eq 18356028
          ffprobe -v error -show_entries format=duration -of default=nw=1 QueueMonster/saas/assets/videos/intro.mp4
          ffmpeg -y -loglevel error -ss 71 -i QueueMonster/saas/assets/videos/intro.mp4 -frames:v 1 -q:v 4 QueueMonster/saas/assets/videos/intro-poster.jpg
          ffmpeg -y -loglevel error -ss 71 -i QueueMonster/saas/assets/videos/intro.mp4 -frames:v 1 -vf "scale=1200:630:force_original_aspect_ratio=decrease,pad=1200:630:(ow-iw)/2:(oh-ih)/2:color=0x291c3d" -q:v 4 QueueMonster/saas/assets/videos/intro-og.jpg
          printf '%s\n' '# 排隊怪獸影片版本' '' '- **V2｜第二版店家品牌行銷影片**' '- 發布檔案：intro.mp4' '- 長度：75秒' '- SHA256：203ad8a2949a8633db6d458f49512ca41d2dc41ec97041ab52bc0f4733e4c393' '- 品牌 SLOGAN：把時間留給生意，把雜事留給排隊怪獸。' > QueueMonster/saas/assets/videos/VIDEO_VERSION.md
          git rm -rq .github/video-v2-chunks .github/workflows/queue-monster-v2-restore.yml
          git add QueueMonster/saas/assets/videos/intro.mp4 QueueMonster/saas/assets/videos/intro-poster.jpg QueueMonster/saas/assets/videos/intro-og.jpg QueueMonster/saas/assets/videos/VIDEO_VERSION.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "QueueMonster: publish V2 merchant marketing video (75s)"
          git push origin HEAD:main
      - name: Dispatch GitHub Pages rebuild for the new video
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run line-saas-pages.yml --ref main
