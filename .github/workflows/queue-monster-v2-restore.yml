name: QueueMonster V2 restore and publish
on:
  push:
    branches: [main]
    paths:
      - ".github/video-v2-chunks/**"
      - ".github/workflows/queue-monster-v2-restore.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Restore user video and commit V2 to main
        shell: bash
        run: |
          set -euo pipefail
          cat .github/video-v2-chunks/part-* > QueueMonster/saas/assets/videos/intro.mp4
          echo "203ad8a2949a8633db6d458f49512ca41d2dc41ec97041ab52bc0f4733e4c393  QueueMonster/saas/assets/videos/intro.mp4" | sha256sum -c -
          test "$(stat -c %s QueueMonster/saas/assets/videos/intro.mp4)" -eq 18356028
          test "$(git hash-object QueueMonster/saas/assets/videos/intro.mp4)" = 05a44885e964f860d22c38cd4894e92d74e0aa71
          printf '%s\n' '# 排隊怪獸影片版本' '' '- **V2｜第二版店家品牌行銷影片**' '- 發布檔案：intro.mp4' '- 長度：75秒' '- SHA256：203ad8a2949a8633db6d458f49512ca41d2dc41ec97041ab52bc0f4733e4c393' '- 品牌 SLOGAN：把時間留給生意，把雜事留給排隊怪獸。' > QueueMonster/saas/assets/videos/VIDEO_VERSION.md
          git rm -rq .github/video-v2-chunks .github/workflows/queue-monster-v2-restore.yml
          git add -- QueueMonster/saas/assets/videos/intro.mp4 QueueMonster/saas/assets/videos/VIDEO_VERSION.md
          test "$(git ls-files --stage QueueMonster/saas/assets/videos/intro.mp4 | awk '{print $2}')" = 05a44885e964f860d22c38cd4894e92d74e0aa71
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "QueueMonster: publish verified V2 merchant video 75s"
          git push origin HEAD:main
      - name: Dispatch Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run line-saas-pages.yml --ref main
