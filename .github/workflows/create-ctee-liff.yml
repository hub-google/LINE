name: Manage LINE LIFF apps

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose one LIFF administration operation"
        required: true
        type: choice
        default: ensure-ctee
        options:
          - ensure-ctee
          - rename-queue

permissions:
  contents: read

concurrency:
  group: line-liff-management
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LINE_LOGIN_CHANNEL_ID: ${{ secrets.LINE_LOGIN_CHANNEL_ID }}
      LINE_LOGIN_CHANNEL_SECRET: ${{ secrets.LINE_LOGIN_CHANNEL_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate LIFF management script
        run: python3 -m py_compile .github/scripts/create-ctee-liff.py
      - name: Create or reuse CTEE LIFF, or safely rename Queue LIFF
        shell: bash
        env:
          LIFF_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$LIFF_OPERATION" in
            ensure-ctee)
              python3 .github/scripts/create-ctee-liff.py ;;
            rename-queue)
              python3 .github/scripts/create-ctee-liff.py --rename-queue ;;
            *)
              echo "::error title=Unknown operation::Allowed actions: ensure-ctee, rename-queue"
              exit 2 ;;
          esac
