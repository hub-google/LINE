name: LINE Workforce real Auth E2E acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workforce-management/tests/workforce-auth-roles-e2e.mjs"
      - "workforce-management/app.js"
      - "workforce-management/supabase/migrations/**"
      - ".github/workflows/line-workforce-auth-e2e.yml"
permissions:
  contents: read
concurrency:
  group: workforce-real-auth-e2e
  cancel-in-progress: false
jobs:
  auth-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify secure management token is configured
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing secret::SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi
      - name: Install pinned browser test runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real two-user Auth, approval, RLS and cleanup
        run: node workforce-management/tests/workforce-auth-roles-e2e.mjs
      - name: Archive redacted E2E log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workforce-real-auth-e2e-results
          path: workforce-management/auth-e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7
