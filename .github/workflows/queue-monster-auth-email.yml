name: 排隊怪獸｜身分驗證郵件品牌與密碼政策
on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/queue-monster-auth-email.py"
      - ".github/workflows/queue-monster-auth-email.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Queue Monster-only email branding without changing other projects
        run: python3 .github/scripts/queue-monster-auth-email.py
