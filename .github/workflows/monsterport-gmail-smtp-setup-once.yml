name: MonsterPort｜Gmail SMTP 初次設定
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monsterport-gmail-smtp-setup-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup-smtp:
    name: 設定排隊怪獸和 Monster Arena 的 SMTP
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MONSTERPORT_SMTP_TARGET: arena
    steps:
      - uses: actions/checkout@v4
      - name: Gmail SMTP 驗證與雙專案設定
        run: python3 .github/scripts/configure-monsterport-gmail-smtp.py

# Retry Gmail SMTP validation using port 587 STARTTLS first.

# Stage 1: Arena only; verify delivery before configuring Queue Monster.

# Retry: correct Management API smtp_port string type.
