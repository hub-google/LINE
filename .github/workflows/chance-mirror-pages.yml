name: 同步 Chance 十項產品到公開網頁
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chance-mirror-pages.yml'
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chance-pages-mirror
  cancel-in-progress: false

jobs:
  publish-chance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: 取得 Chance 原始碼
        run: |
          git clone --depth 1 --branch main https://github.com/hub-google/Chance.git "$RUNNER_TEMP/chance-source"
      - name: 測試產品及雲端程式
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/chance-source"
          node --check "$source_dir/assets/engine.js"
          node --check "$source_dir/assets/cloud.js"
          node --test "$source_dir/tests/verify.test.mjs"
          for slug in invoice-proof custom-order-payments carton-inventory saas-renewal-audit filter-service chargeback-evidence contract-work-orders shortstay-profit parking-roi laundry-payback; do
            test -f "$source_dir/$slug/index.html"
            test -f "$source_dir/$slug/PRD.md"
          done
      - name: 僅更新 gh-pages/chance，保留 LINE 其他網站
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          pubdir="$RUNNER_TEMP/chance-public-site"
          git worktree add --detach "$pubdir" origin/gh-pages
          mkdir -p "$pubdir/chance"
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='tests' "$RUNNER_TEMP/chance-source/" "$pubdir/chance/"
          git -C "$pubdir" add -A -- chance
          if git -C "$pubdir" diff --cached --quiet; then
            echo "Chance pages already synchronized"
            exit 0
          fi
          git -C "$pubdir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "deploy: mirror Chance apps"
          # Another LINE workflow may have advanced gh-pages; rebase once before retrying.
          for attempt in 1 2 3; do
            if git -C "$pubdir" push origin HEAD:gh-pages; then
              echo "Published /LINE/chance/ without editing other site folders"
              exit 0
            fi
            git -C "$pubdir" fetch origin gh-pages
            git -C "$pubdir" rebase origin/gh-pages
          done
          echo "::error::Could not update gh-pages after retries"
          exit 1
