name: QueueMonster OA | FoodRadar daily two-method report
on:
  # Manual only. No scheduled or push-triggered LINE FoodRadar audit messages.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINE_MESSAGING_ACCESS_TOKEN: ${{ secrets.LINE_MESSAGING_ACCESS_TOKEN }}
      REPORT_LINE_USER_ID: ${{ secrets.REPORT_LINE_USER_ID }}
    steps:
      - name: Send report using existing QueueMonster LINE OA channel
        shell: python
        run: |
          import datetime, hashlib, hmac, json, os, re, urllib.request, urllib.error
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          today = now.strftime("%Y-%m-%d")
          token = os.environ.get("LINE_MESSAGING_ACCESS_TOKEN", "")
          target = os.environ.get("REPORT_LINE_USER_ID", "")
          if not token:
              raise RuntimeError("Missing existing LINE_MESSAGING_ACCESS_TOKEN in hub-google/LINE secrets")
          recipients=[]
          if target:
              if not re.fullmatch(r"U[0-9a-fA-F]{32}",target):
                  raise RuntimeError("Invalid REPORT_LINE_USER_ID: expected signed LINE UUID")
              recipients=[target]
          else:
              # Allow opt-in by sending 訂閱FoodRadar to the existing
              # QueueMonster platform OA, without putting private LINE IDs
              # into a public GitHub repository or needing a new secret.
              day=now.strftime("%Y-%m-%d")
              signature=hmac.new(token.encode(),("foodradar-subscribers:"+day).encode(),hashlib.sha256).hexdigest()
              endpoint="https://unapiwajmgqqtdkixaab.supabase.co/functions/v1/line-bridge?action=foodradar-subscribers"
              query=urllib.request.Request(endpoint,headers={
                  "X-FoodRadar-Date":day,
                  "X-FoodRadar-Signature":signature,
                  "User-Agent":"QueueMonster-FoodRadar-Report/1.0"})
              try:
                  with urllib.request.urlopen(query,timeout=20) as response:
                      subscribers=json.load(response)
                  recipients=[u for u in subscribers.get("recipients",[])
                              if isinstance(u,str) and re.fullmatch(r"U[0-9a-fA-F]{32}",u)]
                  recipients=list(dict.fromkeys(recipients))
              except urllib.error.HTTPError as exc:
                  raise RuntimeError("Unable to read subscribed LINE recipients (HTTP "+str(exc.code)+")") from None
          if not recipients:
              raise RuntimeError("No FoodRadar LINE subscriber: send 訂閱FoodRadar to 排隊怪獸 LINE OA once")
          url = "https://raw.githubusercontent.com/fafagoback/FoodRadar/main/audit-results/latest.json?ts=" + str(int(now.timestamp()))
          try:
              req=urllib.request.Request(url,headers={"User-Agent":"QueueMonster-FoodRadar-Audit/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=25) as res:
                  report=json.load(res)
          except Exception as exc:
              report={"date":"", "stores":[], "fatal_error":"Cannot retrieve FoodRadar report: "+type(exc).__name__}
          # Present an executive summary, not implementation field names.
          report_date = str(report.get("date") or "未知")
          current = report_date == today
          full = report.get("full_catalog_reconciliation") or {}
          stats = full.get("totals") or {}
          turso = full.get("turso") or {}
          report_ok = full.get("status") == "PASS_WITHIN_OBSERVED_RAW_SCOPE" and turso.get("same_batch") is True

          def amount(value,unit=""):
              return f"{value:,}{unit}" if isinstance(value,int) else "尚無資料"

          def batch_date(value):
              value = str(value or "")
              if len(value) >= 12 and value[:12].isdigit():
                  return f"{value[:4]}/{value[4:6]}/{value[6:8]} {value[8:10]}:{value[10:12]}"
              return "未知"

          lines = ["【FoodRadar 每日資料查核】",
                   "報告日期：" + report_date.replace("-","/")]
          if not current:
              lines.append("⚠️ 目前只有前一日的報告，今天尚未完成查核。")
          lines.append("")
          lines.append("一、整體結論")
          if report_ok:
              lines.append("✅ 已抓取的商品，資料保存及價格核對正常。")
          else:
              lines.append("⚠️ 已抓取資料的保存或資料庫核對尚未通過。")
          lines.append("⚠️ 平台全部商品是否都已抓到：尚未證實。")
          if report.get("fatal_error"):
              lines.append("查核異常：" + str(report["fatal_error"])[:110])

          lines.extend(["","二、全店資料核對"])
          if full:
              lines.append("最新完整資料：" + batch_date(full.get("batch_id")))
              lines.append("已核對店家：" + amount(full.get("captured_store_count")," 家"))
              lines.append("原始商品：" + amount(stats.get("raw_unique_skus")," 款"))
              lines.append("資料庫轉換：" + amount(stats.get("etl_unique_skus")," 款"))
              lines.append("轉換時漏掉：" + amount(stats.get("raw_missing_in_etl")," 款"))
              lines.append("價格不一致：" + amount(stats.get("price_mismatches")," 款"))
              lines.append("正式資料庫：" + ("已與本批同步" if turso.get("same_batch") is True else "尚未核對一致"))
          else:
              lines.append("⚠️ 尚無可確認的全店核對結果。")
          lines.append("（以上是已抓到資料的核對，不代表平台所有商品。）")

          lines.extend(["","三、三間代表店家"])
          stores = report.get("stores") or []
          for store in stores:
              label=str(store.get("store") or "未知店家")
              label=(label.replace("Costco 好市多","好市多")
                          .replace("全聯福利中心","全聯")
                          .replace("Uber Eats 優市","優市"))
              api=store.get("api") or {}
              lines.append("• "+label+"：" + amount(api.get("count")," 筆"))
          if not stores:
              lines.append("⚠️ 代表店家尚未完成查核。")
          lines.append("（筆數是 API 抓取紀錄，可能含跨分類重複商品。）")

          lines.extend(["","四、目前還沒驗證的部分"])
          if report.get("both_independent_methods_verified") is True:
              lines.append("✅ API 與網頁觀測均已完成交叉核對。")
          else:
              blocked=any((s.get("browser") or {}).get("status") == "BLOCKED_BY_PLATFORM_SECURITY"
                          for s in stores)
              if blocked:
                  lines.append("❌ 網頁直接讀取遭 Uber Eats 安全驗證阻擋。")
                  lines.append("因此無法使用瀏覽器對照方法確認是否還有漏抓商品。")
              else:
                  lines.append("⚠️ 網頁對照方式尚未驗證成功。")
              lines.append("待解決：取得可正常讀取的獨立對照資料來源。")

          lines.extend(["","詳細報告：",
                        "https://github.com/fafagoback/FoodRadar/blob/main/audit-results/latest.json"])
          # A real LF, not literal backslash-n (the former version rendered ¥n).
          message="\n".join(lines)
          if "\\n" in message or message.count("\n") < 12:
              raise RuntimeError("Invalid LINE report formatting: check newline escaping")
          if len(message) > 4900:
              raise RuntimeError("LINE report exceeds safe length")
          print("LINE_FORMAT_PREVIEW_START")
          print(message)
          print("LINE_FORMAT_PREVIEW_END")
          delivered=0
          for recipient in recipients:
              payload=json.dumps({"to":recipient,"messages":[{"type":"text","text":message}]},ensure_ascii=False).encode("utf-8")
              request=urllib.request.Request("https://api.line.me/v2/bot/message/push",data=payload,method="POST",
                  headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(request,timeout=25) as response:
                      if response.status not in (200,202):
                          raise RuntimeError("Unexpected LINE status")
                      delivered+=1
              except urllib.error.HTTPError as exc:
                  raise RuntimeError("LINE push failed with HTTP "+str(exc.code)) from None
          print("FoodRadar report delivered using QueueMonster OA; recipients="+str(delivered)+", all IDs redacted.")
