name: AntiScam CI
on:
  push:
    branches: [main]
    paths:
      - 'AntiScam/**'
      - '.github/workflows/antiscam-ci.yml'
  pull_request:
    paths:
      - 'AntiScam/**'
      - '.github/workflows/antiscam-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AntiScam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Regression tests
        run: npm test
